<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WR OS+ — Версия 18</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><polygon points="2,2 20,10 12,12 10,20" fill="white" stroke="black" stroke-width="1.5"/><circle cx="18" cy="18" r="3" fill="white" stroke="black"/></svg>') 4 4, auto;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    .desktop {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-size: cover;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .desktop-icons {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      bottom: 82px;
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 10px 12px;
      z-index: 20;
      overflow: hidden;
      padding-right: 4px;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 85px;
      cursor: pointer;
      padding: 8px 4px;
      border-radius: 10px;
      transition: 0.1s;
      color: white;
      text-shadow: 0 1px 2px black;
      backdrop-filter: blur(4px);
    }
    .desktop-icon:hover {
      background: rgba(255,255,240,0.25);
      transform: scale(1.02);
    }
    .desktop-icon .icon-img { font-size: 42px; margin-bottom: 6px; }
    .desktop-icon span { font-size: 12px; font-weight: 500; }

    .window {
      position: absolute;
      background: #f5f5f5;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      z-index: 100;
      overflow: hidden;
      resize: both;
      min-width: 300px;
      min-height: 250px;
    }
    .window.active { z-index: 300; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }

    @keyframes appPop {
      0% { opacity: 0; transform: translateY(24px) scale(.94); filter: blur(10px);}
      55% { opacity: .85; transform: translateY(4px) scale(.985); filter: blur(2px);}
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0);}
    }
    @keyframes closeAnim {
      0% { opacity: 1; transform: scale(1);}
      100% { opacity: 0; transform: scale(0.8);}
    }
    @keyframes minAnim {
      0% { opacity: 1; transform: scale(1);}
      100% { opacity: 0; transform: scale(0.2) translateY(80px);}
    }
    .window { animation: appPop .42s cubic-bezier(.22,1,.36,1); transform-origin: center center; }
    .window-closing { animation: closeAnim 0.15s forwards !important; pointer-events: none; }
    .window-minimizing { animation: minAnim 0.18s forwards !important; pointer-events: none; }

    .window-header {
      background: linear-gradient(105deg, #1c6fb0, #2a7fcf);
      padding: 10px 14px;
      cursor: grab;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      font-weight: 600;
    }
    .window-header:active { cursor: grabbing; }
    .window-controls button {
      background: rgba(0,0,0,0.25);
      border: none;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    .close-btn:hover { background: #e81123 !important; }
    .window-content {
      flex: 1;
      padding: 18px;
      background: white;
      overflow: auto;
    }

    .taskbar {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      height: 52px;
      background: rgba(28, 28, 35, 0.85);
      backdrop-filter: blur(28px);
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      z-index: 1000;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .start-button, .taskbar-action {
      background: #2b5f9e;
      padding: 6px 14px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-right: 10px;
      transition: 0.1s;
    }
    .taskbar-action span:last-child { display: none; }
    .taskbar-action { font-size: 20px; padding: 6px 12px; }
    .start-button:hover, .taskbar-action:hover { background: #1f4980; transform: scale(0.96); }
    .taskbar-icons { display: flex; gap: 8px; flex: 1; overflow-x: auto; }
    .taskbar-app {
      background: rgba(255,255,245,0.15);
      padding: 5px 16px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }
    .taskbar-app:hover { background: rgba(255,255,255,0.3); }

    .start-menu {
      position: absolute;
      bottom: 70px;
      left: 18px;
      width: 340px;
      background: rgba(20,20,28,0.96);
      backdrop-filter: blur(36px);
      border-radius: 28px;
      padding: 18px;
      color: white;
      z-index: 1100;
      transition: 0.2s;
    }
    .start-menu.hidden { opacity: 0; transform: scale(0.85); pointer-events: none; }
    .start-app-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 12px;
      border-radius: 20px;
      cursor: pointer;
    }
    .start-app-item:hover { background: #2f6eb3; }

    .settings-section {
      margin-bottom: 20px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 15px;
    }
    .settings-section h4 {
      margin-bottom: 10px;
      color: #333;
    }
    .wallpaper-preview {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .wallpaper-option {
      width: 70px;
      height: 55px;
      border-radius: 14px;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .wallpaper-option:hover { transform: scale(1.05); border-color: white; }

    .color-input {
      width: 60px;
      height: 40px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 5px;
    }

    .slider {
      width: 100%;
      margin: 10px 0;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .toggle-switch {
      width: 44px;
      height: 24px;
      background: #aaa;
      border-radius: 40px;
      cursor: pointer;
      position: relative;
      transition: 0.1s;
    }
    .toggle-switch.active { background: #2b9eff; }
    .toggle-switch::after {
      content: "";
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 20px;
      position: absolute;
      top: 2px;
      left: 3px;
      transition: 0.1s;
    }
    .toggle-switch.active::after { left: 21px; }

    .store-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .store-card {
      background: #f0f4fa;
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: 0.1s;
    }
    .store-card:hover { background: #e2e8f2; transform: translateY(-3px); }
    .store-icon { font-size: 48px; margin-bottom: 8px; }

    .file-list {
      list-style: none;
    }
    .file-list li {
      padding: 8px;
      margin: 4px 0;
      background: #f8f9fa;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .file-list li:hover { background: #e9ecef; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal {
      background: white;
      border-radius: 28px;
      width: 360px;
      padding: 28px;
      text-align: center;
      animation: appPop 0.2s;
    }
    .modal-icon { font-size: 64px; margin-bottom: 12px; }
    .modal button {
      background: #2b5f9e;
      color: white;
      border: none;
      border-radius: 40px;
      padding: 10px 24px;
      margin-top: 16px;
      cursor: pointer;
    }
    .install-progress { font-size: 14px; margin-top: 12px; color: #2b5f9e; }


    .wr-toast-container { position:fixed; right:22px; top:22px; z-index:5000; display:flex; flex-direction:column; gap:10px; pointer-events:none; }
    .wr-toast { min-width:280px; max-width:380px; padding:14px 16px; border-radius:18px; color:#fff; background:rgba(24,24,30,.88); backdrop-filter:blur(24px); box-shadow:0 12px 40px rgba(0,0,0,.28); animation:toastIn .35s cubic-bezier(.22,1,.36,1); font-size:14px; }
    .wr-toast small { display:block; opacity:.7; margin-top:3px; }
    @keyframes toastIn { from { opacity:0; transform:translateX(35px) scale(.95); } to { opacity:1; transform:none; } }
    @keyframes toastOut { to { opacity:0; transform:translateX(35px) scale(.95); } }
    .developer-shell { display:flex; flex-direction:column; gap:14px; }
    .developer-card { background:#f4f6fb; border-radius:18px; padding:14px; display:flex; align-items:center; gap:12px; }
    .developer-icon { width:52px; height:52px; border-radius:15px; display:grid; place-items:center; background:#e7ebf5; font-size:28px; overflow:hidden; flex:none; }
    .developer-icon img { width:100%; height:100%; object-fit:cover; }
    .dev-btn { border:0; border-radius:18px; padding:10px 16px; cursor:pointer; background:#2b5f9e; color:#fff; font-weight:600; }
    .dev-btn.secondary { background:#e9edf5; color:#26344a; }
    .dev-plus { width:56px; height:56px; border-radius:18px; border:0; background:#2b5f9e; color:#fff; font-size:28px; cursor:pointer; }
    .dev-input, .dev-textarea { width:100%; border:1px solid #d7dce6; border-radius:14px; padding:11px 13px; font:inherit; margin-top:7px; }
    .dev-textarea { min-height:180px; resize:vertical; font-family:monospace; font-size:12px; }

    .browser-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      align-items: center;
    }
    .browser-url {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 30px;
      font-size: 14px;
    }
    .browser-go {
      background: #2b5f9e;
      color: white;
      border: none;
      border-radius: 30px;
      padding: 8px 20px;
      cursor: pointer;
    }
    .browser-frame {
      width: 100%;
      height: calc(100% - 60px);
      border: none;
      border-radius: 12px;
    }

    .boot-screen { position:fixed; inset:0; z-index:99999; display:flex; align-items:center; justify-content:center; background:#07110f; color:white; transition:opacity .55s ease, visibility .55s ease; }
    .boot-screen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
    .boot-inner { width:min(430px,88vw); text-align:center; }
    .boot-logo { font-size:72px; margin-bottom:14px; animation:bootPulse 1.2s ease-in-out infinite; }
    .boot-title { font-size:28px; font-weight:700; letter-spacing:.4px; }
    .boot-sub { margin-top:8px; opacity:.65; font-size:13px; }
    .boot-loader { height:4px; background:rgba(255,255,255,.12); border-radius:99px; overflow:hidden; margin-top:28px; }
    .boot-loader i { display:block; height:100%; width:35%; background:linear-gradient(90deg,#2b9a76,#55c9aa); border-radius:99px; animation:bootLoad 1.5s ease-in-out infinite; }
    @keyframes bootPulse {50%{transform:scale(1.05);opacity:.78}}
    @keyframes bootLoad {0%{transform:translateX(-120%)}100%{transform:translateX(360%)}}
    .user-screen { position:fixed; inset:0; z-index:99998; display:flex; align-items:center; justify-content:center; background:linear-gradient(145deg,#07110f,#102c26); color:white; opacity:0; pointer-events:none; transition:opacity .45s; }
    .user-screen.show { opacity:1; pointer-events:auto; }
    .user-panel { width:min(520px,90vw); text-align:center; }
    .user-panel h1 { font-size:30px; margin-bottom:20px; }
    .user-grid { display:flex; flex-wrap:wrap; justify-content:center; gap:14px; }
    .user-card { width:145px; min-height:130px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.08); backdrop-filter:blur(20px); border-radius:24px; padding:18px; color:white; cursor:pointer; transition:.2s; }
    .user-card:hover { transform:translateY(-3px) scale(1.02); background:rgba(255,255,255,.14); }
    .user-avatar { width:58px; height:58px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.14); font-size:30px; }
    .user-add { border-style:dashed; opacity:.8; }
    .store-loading { display:flex; align-items:center; justify-content:center; gap:8px; }
    .store-spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,.25); border-top-color:currentColor; border-radius:50%; animation:spin .7s linear infinite; display:inline-block; }
    @keyframes spin {to{transform:rotate(360deg)}}
    .main-file-button { width:100%; margin-top:10px; padding:10px 14px; border:0; border-radius:14px; background:#202c39; color:white; font-weight:700; cursor:pointer; }
    .main-file-button:hover { background:#294054; }
  
/* WR OS+ v16 fixes */
.desktop-icons{display:block;overflow:hidden;position:absolute}
.desktop-icon{position:absolute;left:0;top:0;width:85px;height:88px;box-sizing:border-box;cursor:grab;user-select:none}
.desktop-icon:active{cursor:grabbing}
.desktop-icon.dragging{z-index:9999;transform:scale(1.03)}
.desktop-icon .icon-img{pointer-events:none}.desktop-icon span{pointer-events:none;display:block;max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* WR OS+ v14 */ .desktop-icons{display:block;overflow:hidden}.desktop-icon{position:absolute;left:0;top:0}.store-grid{grid-template-columns:repeat(3,minmax(0,1fr));max-height:470px;overflow:auto;padding:4px}.store-card{min-height:180px}.dark-mode .window-content{background:#15171b;color:#f3f4f6}.dark-mode .store-card,.dark-mode .file-list li{background:#22262d;color:#f3f4f6}.dark-mode input,.dark-mode textarea,.dark-mode select{background:#20242a;color:#fff;border-color:#3b414b}.context-menu{position:fixed;z-index:100000;background:rgba(30,32,36,.97);color:#fff;padding:6px;border-radius:10px;box-shadow:0 12px 35px #0008;min-width:190px}.context-menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:9px;border-radius:7px}.context-menu button:hover{background:#ffffff1c}.terminal-output{background:#0b0d0f;color:#b9f6ca;padding:12px;border-radius:12px;height:330px;overflow:auto;font:13px ui-monospace,monospace;white-space:pre-wrap}.terminal-input{width:100%;background:#0b0d0f;color:#b9f6ca;border:1px solid #29332d;border-radius:10px;padding:10px;font:13px ui-monospace,monospace}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc-grid button{width:auto;height:48px;background:#e9edf3;color:#111}.calc-display{width:100%;font-size:24px;padding:12px;border-radius:12px;border:1px solid #ccd3dc;text-align:right;margin-bottom:10px}

/* ================= WR OS+ v18 ================= */
.wr18-app-splash{position:absolute;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(245,245,245,.96);backdrop-filter:blur(18px);color:#172033;opacity:1;transition:opacity .25s ease}
.wr18-app-splash.hide{opacity:0;pointer-events:none}
.wr18-splash-avatar{width:78px;height:78px;border-radius:22px;display:grid;place-items:center;font-size:48px;background:rgba(43,95,158,.10);box-shadow:0 12px 35px rgba(0,0,0,.12)}
.wr18-splash-name{font-size:18px;font-weight:700;margin-top:12px}
.dark-mode .wr18-app-splash{background:rgba(18,20,24,.97);color:#fff}
.wr18-store-head{padding:18px;border-radius:22px;background:linear-gradient(135deg,#112b29,#1e5d4d);color:#fff;margin-bottom:14px}
.wr18-store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.wr18-store-card{background:linear-gradient(145deg,#f5f7fb,#e9eef6);border:1px solid #dfe5ef;border-radius:22px;padding:16px;min-height:185px;display:flex;flex-direction:column;cursor:pointer;transition:.18s}
.wr18-store-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #0001}
.dark-mode .wr18-store-card{background:#20242b;border-color:#353b46;color:#fff}
.wr18-wall{height:74px;border-radius:16px;background-size:cover;background-position:center;cursor:pointer;border:2px solid transparent}
.wr18-wall:hover{border-color:#2b9eff;transform:scale(1.02)}
.wr18-setting-group{padding:15px;border-radius:20px;background:#f4f6fa;margin-bottom:12px}
.dark-mode .wr18-setting-group{background:#20242a}
.wr18-selected{outline:2px solid #55c9aa;background:rgba(85,201,170,.18)!important}
.wr18-wallet-card{background:linear-gradient(135deg,#102c26,#173f36);color:white;border-radius:25px;padding:22px;min-height:160px;box-shadow:0 16px 40px #0003}
.wr18-wallet-number{letter-spacing:3px;font-size:19px;margin-top:26px}
.wr18-wallet-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.wr18-pill{border:0;border-radius:999px;padding:9px 14px;background:#2b9e76;color:#fff;cursor:pointer;font-weight:700}
.wr18-danger{background:#b42318!important}

</style>
</head>
<body>
<div class="wr-toast-container" id="wrToastContainer"></div><div class="boot-screen" id="bootScreen"><div class="boot-inner"><div class="boot-logo">◈</div><div class="boot-title">WR OS</div><div class="boot-sub">Запуск системы…</div><div class="boot-loader"><i></i></div></div></div>
<div class="user-screen" id="userScreen"><div class="user-panel"><h1>Кто использует WR OS?</h1><div class="user-grid" id="userGrid"></div></div></div>

<div class="desktop" id="desktop">
  <div class="desktop-icons" id="desktopIcons">
    <div class="desktop-icon" data-app="explorer"><div class="icon-img">📁</div><span>Проводник</span></div>
    <div class="desktop-icon" data-app="browser"><div class="icon-img">🌐</div><span>Браузер</span></div>
    <div class="desktop-icon" data-app="notepad"><div class="icon-img">📓</div><span>Блокнот</span></div>
    <div class="desktop-icon" data-app="store"><div class="icon-img">🛒</div><span>Магазин</span></div>
    <div class="desktop-icon" data-app="settings"><div class="icon-img">⚙️</div><span>Параметры</span></div>
  </div>
</div>

<div class="taskbar">
  <div class="start-button" id="startButton">◆ Пуск</div>
  <div class="taskbar-action" id="showDesktopBtn">📌</div>
  <div class="taskbar-action" id="fullscreenBtn">⛶</div>
  <div class="taskbar-icons" id="taskbarIcons"></div>
  <div id="clock" style="color:white; background:rgba(0,0,0,0.4); padding:5px 14px; border-radius:40px;"></div>
</div>

<div id="startMenu" class="start-menu hidden">
  <div class="start-header">🌟 Центр приложений</div>
  <div class="start-app-list">
    <div class="start-app-item" data-app="explorer">📁 Проводник</div>
    <div class="start-app-item" data-app="browser">🌐 Браузер</div>
    <div class="start-app-item" data-app="notepad">✍️ Блокнот</div>
    <div class="start-app-item" data-app="store">🛒 Магазин</div>
    <div class="start-app-item" data-app="settings">⚙️ Параметры</div>
    <div class="start-app-item" data-app="about">ℹ️ О системе</div>
  </div>
</div>

<script>
  // ========== ПРОФИЛИ ПОЛЬЗОВАТЕЛЕЙ ==========
  function switchUser(id){ currentUserId=id; localStorage.setItem('wrCurrentUserId',id); sessionStorage.setItem('wrBootSelected','1'); location.reload(); }

  // ========== НАСТРОЙКИ / ПРОФИЛИ (инициализируем ДО обоев) ==========
  let users = JSON.parse(localStorage.getItem('wrUsers') || 'null') || [{id:'main', name:'Основной пользователь', avatar:'👤'}];
  let currentUserId = localStorage.getItem('wrCurrentUserId') || users[0].id;
  if (!users.some(u=>u.id===currentUserId)) currentUserId = users[0].id;
  function userPrefix(){ return 'wr_user_'+currentUserId+'_'; }
  function loadUserSettings(){
    const saved=localStorage.getItem(userPrefix()+'settings');
    return saved ? {...{animations:true,taskbarBlur:true,windowOpacity:98,cursorStyle:'default',theme:'light'},...JSON.parse(saved)} : {animations:true,taskbarBlur:true,windowOpacity:98,cursorStyle:'default',theme:'light'};
  }
  let settings = loadUserSettings();
  function saveSettings(){ localStorage.setItem(userPrefix()+'settings',JSON.stringify(settings)); }

  // ======================== ОБОИ (ЦВЕТНЫЕ ГРАДИЕНТЫ + ЗАГРУЗКА СВОИХ) ========================
  const wallpapers = {
    secret29102011: 'linear-gradient(135deg, #041b16 0%, #082f2a 48%, #061d38 100%)',
    gradient1: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
    gradient2: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
    gradient3: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
    gradient4: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
    gradient5: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
    gradient6: 'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
    gradient7: 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)',
    gradient8: 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)'
  };

  function makeDesktopIconDraggable(e,id){
    let sx=0,sy=0,ox=0,oy=0,moving=false;
    e.__wrSuppressClick=false;
    e.onmousedown=ev=>{
      if(ev.button!==0)return;
      // Do NOT preventDefault here: doing so can suppress the browser's click event.
      sx=ev.clientX; sy=ev.clientY;
      ox=parseInt(e.style.left)||0; oy=parseInt(e.style.top)||0;
      moving=false;
      e.classList.add('dragging');
      const mv=move=>{
        const dx=move.clientX-sx, dy=move.clientY-sy;
        if(Math.abs(dx)+Math.abs(dy)>5)moving=true;
        if(!moving)return;
        const box=document.getElementById('desktopIcons');
        const maxX=Math.max(0,box.clientWidth-85), maxY=Math.max(0,box.clientHeight-88);
        let nx=Math.max(0,Math.min(maxX,ox+dx));
        let ny=Math.max(0,Math.min(maxY,oy+dy));
        if(canPlaceIcon(nx,ny,e)){e.style.left=nx+'px';e.style.top=ny+'px'}
      };
      const up=()=>{
        document.removeEventListener('mousemove',mv);
        document.removeEventListener('mouseup',up);
        e.classList.remove('dragging');
        if(moving){
          e.__wrSuppressClick=true;
          const p=desktopPositions();
          p[id]={x:parseInt(e.style.left)||0,y:parseInt(e.style.top)||0};
          saveDesktopPositions(p);
          setTimeout(()=>e.__wrSuppressClick=false,150);
        }
      };
      document.addEventListener('mousemove',mv);
      document.addEventListener('mouseup',up);
    };
  }

  function animateClose(winId) {
    const w = openWindows[winId];
    if (!w) return;
    w.element.classList.add('window-closing');
    setTimeout(() => {
      if (openWindows[winId]) {
        w.element.remove();
        delete openWindows[winId];
        document.getElementById(`task_${winId}`)?.remove();
        if (activeWindowId === winId) {
          activeWindowId = null;
          const keys = Object.keys(openWindows);
          if (keys.length) bringToFront(keys[keys.length-1]);
        }
      }
    }, 160);
  }

  function animateMinimize(winId) {

    setTimeout(() => {

        w.element.style.display = 'none';
        w.minimized = true;
        const btn = document.getElementById(`task_${winId}`);

  function restoreWindow(winId) {

      w.minimized = false;
      const btn = document.getElementById(`task_${winId}`);
      if (btn) btn.style.opacity = '1';

    } else if (w) bringToFront(winId);
  }

  function bringToFront(winId) {
    if (activeWindowId && openWindows[activeWindowId]) openWindows[activeWindowId].element.classList.remove('active');
    activeWindowId = winId;
    const w = openWindows[winId];
    if (w) {
      w.element.classList.add('active');
      let maxZ = 200;
      for (let id in openWindows) {
        let z = parseInt(openWindows[id].element.style.zIndex) || 100;
        if (z > maxZ) maxZ = z;
      }
      w.element.style.zIndex = maxZ + 1;
      if (w.minimized) {
        w.element.style.display = 'flex';
        w.minimized = false;
        const btn = document.getElementById(`task_${winId}`);
        if (btn) btn.style.opacity = '1';
      }
    }
  }

  function createWindow(appId, title, html, w = 520, h = 380, onLoad = null) {
    // One window per app: clicking an icon again restores the existing window.
    const existingId=Object.keys(openWindows).find(k=>{const win=openWindows[k];return win&&win.appId===appId&&win.element&&win.element.isConnected});
    if(existingId){restoreWindow(existingId);return existingId}
    // Remove stale window records left after an interrupted/closed launch.
    Object.keys(openWindows).forEach(k=>{const win=openWindows[k];if(win&&win.appId===appId&&!win.element?.isConnected){delete openWindows[k];document.getElementById(`task_${k}`)?.remove();}});
    const id = 'win_' + Date.now() + '_' + (++winCounter);
    const div = document.createElement('div');
    div.className = 'window';
    div.id = id;
    div.style.width = w + 'px';
    div.style.height = h + 'px';
    if (!settings.animations) div.style.animation = 'none';
    div.style.opacity = settings.windowOpacity / 100;
    const left = 60 + (Object.keys(openWindows).length * 35) % (window.innerWidth - 400);
    const top = 70 + (Object.keys(openWindows).length * 25) % (window.innerHeight - 300);
    div.style.left = Math.min(left, window.innerWidth - w - 20) + 'px';
    div.style.top = Math.min(top, window.innerHeight - h - 80) + 'px';

    const header = document.createElement('div');
    header.className = 'window-header';
    header.innerHTML = `<div>${getIcon(appId)} ${title}</div><div class="window-controls"><button class="minimize-btn">─</button><button class="close-btn">✕</button></div>`;
    const content = document.createElement('div');
    content.className = 'window-content';
    content.innerHTML = html;
    div.appendChild(header);
    div.appendChild(content);
    document.getElementById('desktop').appendChild(div);
    // WR OS 18: in-window app opening splash, never a separate popup.
    try{
      const splash=document.createElement('div');
      splash.className='wr18-app-splash';
      splash.innerHTML=`<div class="wr18-splash-avatar">${getIcon(appId)}</div><div class="wr18-splash-name">${escapeHtml(title)}</div>`;
      div.appendChild(splash);
      setTimeout(()=>{ splash.classList.add('hide'); setTimeout(()=>splash.remove(),260); },1000);
    }catch(e){}

    header.querySelector('.close-btn').onclick = (e) => { e.stopPropagation(); animateClose(id); };
    header.querySelector('.minimize-btn').onclick = (e) => { e.stopPropagation(); animateMinimize(id); };

    let drag = false, dx, dy;
    header.onmousedown = (e) => {
      if (e.target.tagName === 'BUTTON') return;
      drag = true;
      dx = e.clientX - div.offsetLeft;
      dy = e.clientY - div.offsetTop;
      bringToFront(id);
      e.preventDefault();
    };
    window.onmousemove = (e) => {
      if (!drag) return;
      let nx = e.clientX - dx, ny = e.clientY - dy;
      nx = Math.min(Math.max(0, nx), window.innerWidth - div.offsetWidth - 10);
      ny = Math.min(Math.max(0, ny), window.innerHeight - 70 - div.offsetHeight);
      div.style.left = nx + 'px';
      div.style.top = ny + 'px';
    };
    window.onmouseup = () => { drag = false; };

    openWindows[id] = { element: div, appId, title, minimized: false };
    const taskBtn = document.createElement('div');
    taskBtn.id = `task_${id}`;
    taskBtn.className = 'taskbar-app';
    taskBtn.innerHTML = `${getIcon(appId)} ${title}`;
    taskBtn.onclick = () => restoreWindow(id);
    document.getElementById('taskbarIcons').appendChild(taskBtn);
    bringToFront(id);

    if (onLoad) setTimeout(onLoad, 100);
    return id;
  }

pe:'file',mime:f.type,icon:'📄',content:'',size:f.size,externalOnly:true})}}saveFiles();render();notify('WR Files','Файлы добавлены и доступны для открытия')};i.click()};document.getElementById('fc').onclick=()=>{addComputerFilesToWRFiles();};document.getElementById('fx').onclick=()=>{const blob=new Blob([JSON.stringify({version:3,files,installedApps,customApps},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wr-files.json';a.click()};document.getElementById('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d.files)){files=d.files;saveFiles()}if(Array.isArray(d.installedApps)){installedApps=d.installedApps;saveInstalledApps()}if(Array.isArray(d.customApps)){customApps=d.customApps;saveCustomApps()}renderInstalledApps();render();notify('WR Files','Импорт завершён')}catch{notify('WR Files','Неверный JSON')}};r.readAsText(f)}})}

  function wr18BindIcon(el,openFn){
    if(el.__wr18Bound)return; el.__wr18Bound=true;
    let downX=0,downY=0,origX=0,origY=0,moved=false,active=false;
    el.onmousedown=ev=>{
      if(ev.button!==0)return;
      downX=ev.clientX;downY=ev.clientY;origX=parseInt(el.style.left)||0;origY=parseInt(el.style.top)||0;moved=false;active=true;
      const move=e=>{
        if(!active)return;
        const dx=e.clientX-downX,dy=e.clientY-downY;
        if(Math.abs(dx)+Math.abs(dy)<8)return;
        moved=true;
        const box=document.getElementById('desktopIcons');
        const nx=Math.max(0,Math.min(box.clientWidth-85,origX+dx));
        const ny=Math.max(0,Math.min(box.clientHeight-88,origY+dy));
        el.style.left=nx+'px';el.style.top=ny+'px';
      };
      const up=()=>{
        if(!active)return; active=false;
        document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);
        if(moved){
          const id=el.dataset.app,p=desktopPositions();p[id]={x:parseInt(el.style.left)||0,y:parseInt(el.style.top)||0};saveDesktopPositions(p);
          el.dataset.wr18Moved='1';setTimeout(()=>delete el.dataset.wr18Moved,120);
        }
      };
      document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
    };
    el.onclick=ev=>{
      if(el.dataset.wr18Moved==='1'){ev.preventDefault();return;}
      if(ev.ctrlKey||ev.metaKey){el.classList.toggle('wr18-selected');return;}
      openFn();
    };
    el.oncontextmenu=ev=>{
      const app=getInstalledRecord(el.dataset.app);
      if(app)wr18AppMenu(ev,app);
      else ev.preventDefault();
    };
  }
  function wr18BindAllIcons(){
    document.querySelectorAll('.desktop-icon').forEach(el=>{
      const id=el.dataset.app;if(!id)return;
      wr18BindIcon(el,()=>launch(id));
    });
  }

  // --- Multi-select ---
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')document.querySelectorAll('.wr18-selected').forEach(x=>x.classList.remove('wr18-selected'));
  });
  function wr18SelectedDelete(){
    document.querySelectorAll('.wr18-selected').forEach(el=>{
      const app=getInstalledRecord(el.dataset.app); if(app)wr18Deinstall(app.id);
      el.classList.remove('wr18-selected');
    });
  }

  // --- Terminal extensions without changing the original terminal renderer ---
  const oldOpenTerminal=openTerminal;
  window.wr18TerminalCommand=function(q){
    const a=String(q||'').trim().split(/\s+/),c=(a.shift()||'').toLowerCase(),rest=a.join(' ');
    if(c==='open'){
      const id=rest.toLowerCase();
      if(id==='wallet'){ if(typeof openWallet==='function')openWallet(); else notify('WR Terminal','Wallet недоступен'); return true; }
      if(id==='wros27'||id==='wros'&&a[0]==='27'){notify('WR OS','WR OS 27 недоступен до установки');return true;}
      launch(id); return true;
    }
    if(c==='install'){
      if(rest.toLowerCase()==='wallet'){if(typeof addInstalledApp==='function')addInstalledApp({id:'wallet',name:'WR Wallet',icon:'💳'});return true;}
      if(rest.toLowerCase()==='wros 27'){if(typeof addInstalledApp==='function')addInstalledApp({id:'wros27',name:'WR OS 27',icon:'⬡'});return true;}
      return false;
    }
    if(c==='deinstall'){wr18Deinstall(rest);return true;}
    return false;
  };

  // --- Wallet ---
  function openWallet(){
    const existing=Object.keys(openWindows).find(k=>openWindows[k].appId==='wallet');
    if(existing){restoreWindow(existing);return existing}
    const html=`<div style="display:flex;flex-direction:column;gap:14px">
      <div class="wr18-wallet-card"><div style="opacity:.7">WR Wallet</div><div style="font-size:28px;font-weight:800;margin-top:10px">₩ 1 000 000</div><div class="wr18-wallet-number">**** **** **** 2048</div></div>
      <div class="wr18-wallet-actions"><button class="wr18-pill" id="issueCard18">💳 Выпустить карту</button><button class="wr18-pill" id="walletBalance18">💰 Баланс</button></div>
      <div id="walletInfo18" style="padding:14px;border-radius:18px;background:#f4f6fa">Кошелёк готов к работе.</div>
    </div>`;
    return createWindow('wallet','WR Wallet',html,500,480,()=>{
      document.getElementById('walletBalance18').onclick=()=>document.getElementById('walletInfo18').textContent='Баланс: 1 000 000 W';
      document.getElementById('issueCard18').onclick=()=>{
        const num='5555 '+Math.floor(1000+Math.random()*9000)+' '+Math.floor(1000+Math.random()*9000)+' '+Math.floor(1000+Math.random()*9000);
        document.getElementById('walletInfo18').innerHTML='<b>Карта выпущена</b><br>'+num+'<br>WR Wallet · WR OS';
      };
    });
  }
  window.openWallet=openWallet;

  // --- WROS 27 ---
  function openWros27(){
    if(!getInstalledRecord('wros27')){notify('WR OS','WR OS 27 не установлено');return}
    const html=`<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px">
      <b style="font-size:17px">Ваша заявка на получение обновления отправлена.</b>
      <p style="margin-top:14px;line-height:1.55">Пока приложение будет недоступно. Пожалуйста, нажмите кнопку Закрыть ниже, чтобы не было проблем с получением обновления и работы вашей ОС.</p>
      <button id="wros27Close18" class="dev-btn" style="margin-top:18px">Закрыть</button>
    </div>`;
    return createWindow('wros27','WR OS 27',html,560,400,()=>document.getElementById('wros27Close18').onclick=()=>{
      wr18Deinstall('wros27');
      const id=Object.keys(openWindows).find(k=>openWindows[k].appId==='wros27');if(id)animateClose(id);
    });
  }
  window.openWros27=openWros27;

  // --- Patch installed app launcher to support v18 apps ---
  const oldLaunchInstalled=launchInstalledApp;
  window.launchInstalledApp=function(id){
    if(id==='wallet'){openWallet();return}
    if(id==='wros27'){openWros27();return}
    return oldLaunchInstalled(id);
  };

  // --- Start/desktop built-ins ---
  const oldLaunch=launch;
  window.wr18Launch=oldLaunch;
  // Keep the original working launch function untouched; add only new app ids through a small wrapper.
  window.launch=function(id){
    if(id==='wallet'){openWallet();closeStart();return}
    if(id==='wros27'){openWros27();closeStart();return}
    return oldLaunch(id);
  };

  // --- App Center redesign: wrap original content without replacing its logic ---
  const oldOpenStore=openStore;
  window.openStore=function(){
    const result=oldOpenStore();
    setTimeout(()=>{
      const w=Object.values(openWindows).find(x=>x.appId==='store'&&x.element?.isConnected);
      if(!w)return;
      const c=w.element.querySelector('.window-content');
      if(c)c.style.padding='14px';
      w.element.querySelector('.window-header')?.setAttribute('data-wr18','1');
    },20);
    return result;
  };

  // --- About version ---
  const oldOpenAbout=openAbout;
  window.openAbout=function(){
    const result=oldOpenAbout();
    setTimeout(()=>{
      const w=Object.values(openWindows).find(x=>x.appId==='about'&&x.element?.isConnected);
      if(w){
        const c=w.element.querySelector('.window-content');
        if(c)c.innerHTML += '<hr style="margin:16px 0"><div><b>WR OS+</b><br>Версия 18<br><span style="opacity:.65">Лаборатория HAORIK</span></div>';
      }
    },20);
    return result;
  };

  // --- Settings: add v18 sections to existing settings window ---
  const oldOpenSettings=openSettings;
  window.openSettings=function(){
    const result=oldOpenSettings();
    setTimeout(()=>{
      const w=Object.values(openWindows).find(x=>x.appId==='settings'&&x.element?.isConnected);
      if(!w)return;
      const c=w.element.querySelector('.window-content'); if(!c)return;
      if(c.dataset.wr18==='1')return;c.dataset.wr18='1';
      const extra=document.createElement('div');
      extra.innerHTML=`
        <div class="wr18-setting-group"><h4>🖥️ Масштаб интерфейса</h4>
          <input id="wr18Scale" type="range" min="80" max="125" value="${settings.wr18Scale||100}" style="width:100%">
          <div id="wr18ScaleLabel">${settings.wr18Scale||100}%</div>
        </div>
        <div class="wr18-setting-group"><h4>🌐 Язык</h4>
          <select id="wr18Lang" class="dev-input">${Object.entries(WR18_LANG).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select>
        </div>
        <div class="wr18-setting-group"><h4>🖼️ Обои WR OS 18</h4>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
            ${Object.keys(WR18_WALLPAPERS).map(k=>`<div class="wr18-wall" data-wrwall="${k}" style="background:${WR18_WALLPAPERS[k]}"></div>`).join('')}
          </div>
        </div>
        <div class="wr18-setting-group"><h4>👤 Пользователь</h4><button id="wr18SwitchUser" class="dev-btn">Сменить пользователя</button></div>
      `;
      c.appendChild(extra);
      const scale=document.getElementById('wr18Scale'); scale.oninput=()=>{settings.wr18Scale=+scale.value;document.getElementById('wr18ScaleLabel').textContent=scale.value+'%';document.documentElement.style.zoom=scale.value/100;saveSettings()};
      const lang=document.getElementById('wr18Lang');lang.value=settings.wr18Language||'ru';lang.onchange=()=>{settings.wr18Language=lang.value;saveSettings();wr18ApplyLanguage()};
      document.querySelectorAll('[data-wrwall]').forEach(x=>x.onclick=()=>wr18SetWall(x.dataset.wrwall));
      document.getElementById('wr18SwitchUser').onclick=()=>{closeStart();renderUsers();document.getElementById('bootScreen').classList.add('hidden');document.getElementById('userScreen').classList.add('show');};
    },40);
    return result;
  };

  // --- Start menu additions ---
  function wr18AddStartItems(){
    const list=document.querySelector('.start-app-list'); if(!list||list.dataset.wr18==='1')return;
    list.dataset.wr18='1';
    const wallet=document.createElement('div');wallet.className='start-app-item';wallet.dataset.app='wallet';wallet.innerHTML='💳 WR Wallet';wallet.onclick=()=>{openWallet();closeStart()};
    const term=document.createElement('div');term.className='start-app-item';term.dataset.app='terminal';term.innerHTML='⌨️ WR Terminal';term.onclick=()=>{openTerminal();closeStart()};
    list.append(wallet,term);
  }

  // --- Replace terminal UI with v18 command layer, while preserving old commands ---
  function wr18OpenTerminal(){
    const html=`<div class="terminal-output" id="wr18TermOut">WR Terminal 1.8<br>Введите <b>help</b> для списка команд.</div><input class="terminal-input" id="wr18TermIn" placeholder="wr@os:~$ ...">`;
    createWindow('terminal','WR Terminal',html,760,540,()=>{
      const o=document.getElementById('wr18TermOut'),i=document.getElementById('wr18TermIn');
      const print=t=>{o.innerHTML+=`<div>${escapeHtml(t)}</div>`;o.scrollTop=o.scrollHeight};
      const run=q=>{
        const raw=q.trim(), a=raw.split(/\s+/), c=(a.shift()||'').toLowerCase(), rest=a.join(' ');
        if(c==='help'||c==='info')return print('help / info\\nopen <app>\\ninstall wallet\\ninstall wros 27\\ndeinstall <app>\\napps\\ndate\\ntime\\nwhoami\\nls\\necho <текст>\\ncalc <выражение>\\ntheme dark|light');
        if(c==='open'){if(rest==='wallet')return openWallet();if(rest==='wros 27'||rest==='wros27')return notify('WR Terminal','WR OS 27 нельзя открыть до установки');return launch(rest)}
        if(c==='install'){if(rest==='wallet'){addInstalledApp({id:'wallet',name:'WR Wallet',icon:'💳'});return}if(rest==='wros 27'||rest==='wros27'){addInstalledApp({id:'wros27',name:'WR OS 27',icon:'⬡'});return}return print('Доступны: wallet, wros 27')}
        if(c==='deinstall'){if(!wr18Deinstall(rest))print('Приложение не найдено');return}
        if(c==='apps')return print(installedApps.map(x=>x.name).join('\\n')||'Нет приложений');
        if(c==='date')return print(new Date().toLocaleDateString('ru-RU'));
        if(c==='time')return print(new Date().toLocaleTimeString('ru-RU'));
        if(c==='whoami')return print((users.find(u=>u.id===currentUserId)||users[0]).name);
        if(c==='ls')return print(files.map(x=>x.name).join('\\n')||'Пусто');
        if(c==='echo')return print(rest);
        if(c==='calc'){try{return print(String(Function('return '+rest)()))}catch{return print('Ошибка вычисления')}}
        if(c==='theme'){settings.theme=a[0]==='dark'?'dark':'light';saveSettings();applySettings();return print('Тема: '+settings.theme)}
        return print('Неизвестная команда. Введите help.');
      };
      i.onkeydown=e=>{if(e.key==='Enter'){print('wr@os:~$ '+i.value);run(i.value);i.value=''}};
      i.focus();
    });
  }
  window.wr18OpenTerminal=wr18OpenTerminal;

  // --- Shutdown animation ---
  function wr18Shutdown(){
    const overlay=document.createElement('div');
    overlay.style='position:fixed;inset:0;background:#050806;color:#fff;z-index:999999;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;opacity:0;transition:opacity .35s';
    overlay.textContent='WR OS выключается…';document.body.appendChild(overlay);
    requestAnimationFrame(()=>overlay.style.opacity='1');
    setTimeout(()=>{try{window.close()}catch(e){};location.replace('about:blank')},1000);
  }
  function wr18PatchStart(){
    wr18AddStartItems();
    const sm=document.getElementById('startMenu');
    if(sm&&!sm.dataset.wr18Shutdown){
      sm.dataset.wr18Shutdown='1';
      const sep=document.createElement('div');sep.style='height:1px;background:#ffffff18;margin:10px 0';
      const shut=document.createElement('div');shut.className='start-app-item';shut.innerHTML='⏻ Завершение работы';shut.onclick=wr18Shutdown;
      const change=document.createElement('div');change.className='start-app-item';change.innerHTML='👤 Сменить пользователя';change.onclick=()=>{closeStart();renderUsers();document.getElementById('bootScreen').classList.add('hidden');document.getElementById('userScreen').classList.add('show')};
      sm.append(sep,change,shut);
    }
  }

  // --- Apply scale/wallpaper after base initialization ---
  setTimeout(()=>{
    if(settings.wr18Scale)document.documentElement.style.zoom=settings.wr18Scale/100;
    const wp=settings.wr18Wallpaper;if(wp)wr18SetWall(wp);
    wr18ApplyLanguage();
    wr18PatchStart();
    wr18BindAllIcons();
    wr18ApplySystem();
    // Existing renderer can add installed icons after this; bind them too.
    const d=document.getElementById('desktopIcons');
    if(d)new MutationObserver(()=>wr18BindAllIcons()).observe(d,{childList:true});
  },1200);

  // Expose safe helpers for DevTools.
  window.WR18={deinstall:wr18Deinstall,restoreSystem:wr18RestoreSystem,openWallet,openWros27};
})();

</script>
</body>
</html>
