<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>DucAI — Claude</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#17191e;--panel2:#20232a;--line:#2b2e36;--text:#f2f3f5;--muted:#9a9eaa;--accent:#a78bfa;--user:#29243a;--assistant:#191b20}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100dvh;overflow:hidden}
button,textarea,input{font:inherit}button{cursor:pointer;color:inherit;border:0}
.app{height:100dvh;display:flex}.sidebar{width:280px;background:#14161a;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px;gap:14px;flex-shrink:0}
.brand{font-size:21px;font-weight:750;letter-spacing:-.7px;padding:4px 5px}.brand span{color:var(--accent)}
.new-chat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;text-align:left}
.new-chat:hover,.chat-item:hover{background:#292c34}.section-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:5px}
.chat-list{overflow:auto;display:flex;flex-direction:column;gap:4px;flex:1}.chat-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;color:#d9dbe1;cursor:pointer;min-width:0}.chat-item.active{background:#292c34}.chat-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.delete-chat{opacity:.55;background:transparent;font-size:17px;padding:0 3px}.delete-chat:hover{opacity:1;color:#ff8888}
.sidebar-bottom{border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:12px}.user-id{overflow-wrap:anywhere;margin-top:5px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}.top-title{font-weight:600}.top-actions{display:flex;gap:8px}.icon-btn{background:transparent;border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--muted)}.icon-btn:hover{color:var(--text);background:var(--panel2)}
.messages{flex:1;overflow:auto;padding:28px 18px 24px;scroll-behavior:smooth}.welcome{max-width:680px;margin:12vh auto 0;text-align:center}.welcome h1{font-size:34px;letter-spacing:-1.3px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0}.message{max-width:850px;margin:0 auto 20px;display:flex;gap:13px;align-items:flex-start}.avatar{width:30px;height:30px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;flex-shrink:0;font-size:13px}.message.user .avatar{background:#44365f}.bubble{min-width:0;flex:1;padding:2px 0;overflow-wrap:anywhere}.message.user .bubble{background:var(--user);border:1px solid #3c3450;border-radius:14px;padding:12px 15px}.message p{margin:0 0 10px}.message p:last-child{margin-bottom:0}.message pre{white-space:pre-wrap;overflow:auto;background:#0d0e11;border:1px solid var(--line);padding:12px;border-radius:10px}.message code{background:#282b32;padding:2px 5px;border-radius:5px}.message pre code{background:transparent;padding:0}.message img{max-width:min(100%,360px);max-height:300px;object-fit:contain;border-radius:10px;margin:8px 8px 0 0}
.composer-wrap{padding:12px 18px 18px;background:linear-gradient(transparent,var(--bg) 20%);flex-shrink:0}.composer{max-width:850px;margin:auto;border:1px solid #3a3d46;background:#1a1c22;border-radius:18px;padding:10px 12px 8px;box-shadow:0 8px 35px #0005}.attachments{display:flex;gap:8px;flex-wrap:wrap}.attachment{position:relative}.attachment img{width:54px;height:54px;object-fit:cover;border-radius:8px}.attachment button{position:absolute;right:-5px;top:-5px;background:#343741;border-radius:50%;width:20px;height:20px}
#prompt{width:100%;resize:none;min-height:48px;max-height:190px;background:transparent;border:0;outline:0;color:var(--text);padding:8px 3px}.composer-bottom{display:flex;align-items:center;justify-content:space-between}.left-tools,.right-tools{display:flex;align-items:center;gap:8px}.tool-btn{background:transparent;color:var(--muted);padding:7px 9px;border-radius:9px}.tool-btn:hover{background:var(--panel2);color:var(--text)}.send{background:var(--accent);color:#17131f;font-weight:700;border-radius:10px;padding:8px 15px}.send:disabled{opacity:.4;cursor:not-allowed}.hint{text-align:center;color:#777b86;font-size:11px;margin-top:8px}
.status{font-size:12px;color:var(--muted);padding:0 4px}.typing{color:var(--muted);font-style:italic}.mobile-menu{display:none}
@media(max-width:700px){.sidebar{position:absolute;z-index:5;inset:0 auto 0 0;transform:translateX(-105%);transition:.2s;width:min(300px,85vw);box-shadow:15px 0 40px #0008}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-block}.topbar{padding:0 12px}.messages{padding:20px 13px}.composer-wrap{padding:8px 10px 12px}.welcome{margin-top:12vh}.welcome h1{font-size:29px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand">Duc<span>AI</span></div>
  <button class="new-chat" id="newChat">＋ Новый чат</button>
  <div class="section-label">История</div>
  <div class="chat-list" id="chatList"></div>
  <div class="sidebar-bottom">Локальный профиль<div class="user-id" id="userId"></div><div style="margin-top:7px">Чаты и настройки хранятся в этом браузере.</div></div>
</aside>
<main class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:10px"><button class="icon-btn mobile-menu" id="menuBtn">☰</button><div class="top-title">DucAI <span style="color:var(--muted);font-weight:400">· Claude</span></div></div>
    <div class="top-actions"><button class="icon-btn" id="exportBtn" title="Экспорт чатов">Экспорт</button><button class="icon-btn" id="themeBtn" title="Сменить тему">◐</button></div>
  </header>
  <section class="messages" id="messages">
    <div class="welcome" id="welcome"><h1>Чем займёмся?</h1><p>Локальный чат с Claude. История остаётся на этом устройстве.</p></div>
  </section>
  <div class="composer-wrap">
    <div class="composer">
      <div class="attachments" id="attachments"></div>
      <textarea id="prompt" rows="1" placeholder="Напиши сообщение Claude..."></textarea>
      <div class="composer-bottom">
        <div class="left-tools"><button class="tool-btn" id="attachBtn" title="Прикрепить изображение">＋</button><input id="fileInput" type="file" accept="image/*" multiple hidden><span class="status" id="status"></span></div>
        <div class="right-tools"><button class="send" id="sendBtn">Отправить ↑</button></div>
      </div>
    </div>
    <div class="hint">Claude может ошибаться. Не отправляй секретные данные.</div>
  </div>
</main>
</div>
<script>
(() => {
"use strict";
// ВСТАВЬ СЮДА СВОЙ КЛЮЧ ANTHROPIC. Он будет доступен в исходном коде этого HTML.
const ANTHROPIC_API_KEY = "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";
const ANTHROPIC_MODEL = "claude-sonnet-5-5";
const DB_NAME="ducai_local", DB_VERSION=1, CHAT_STORE="chats", SETTINGS_STORE="settings";
const $=id=>document.getElementById(id);
let db, currentChatId=null, pendingImages=[], busy=false;
const userId=localStorage.getItem("ducai_local_user") || ("ducai_"+crypto.randomUUID().replaceAll("-","").slice(0,14));
localStorage.setItem("ducai_local_user",userId); $("userId").textContent=userId;

function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(CHAT_STORE))d.createObjectStore(CHAT_STORE,{keyPath:"id"});if(!d.objectStoreNames.contains(SETTINGS_STORE))d.createObjectStore(SETTINGS_STORE,{keyPath:"key"});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function tx(store,mode="readonly"){return db.transaction(store,mode).objectStore(store)}
function getAllChats(){return new Promise((res,rej)=>{const r=tx(CHAT_STORE).getAll();r.onsuccess=()=>res(r.result.sort((a,b)=>b.updatedAt-a.updatedAt));r.onerror=()=>rej(r.error);});}
function getChat(id){return new Promise((res,rej)=>{const r=tx(CHAT_STORE).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function saveChat(chat){return new Promise((res,rej)=>{const r=tx(CHAT_STORE,"readwrite").put(chat);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function removeChat(id){return new Promise((res,rej)=>{const r=tx(CHAT_STORE,"readwrite").delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function setting(key,value){return new Promise((res,rej)=>{const s=tx(SETTINGS_STORE,value===undefined?"readonly":"readwrite");const r=value===undefined?s.get(key):s.put({key,value});r.onsuccess=()=>res(value===undefined?(r.result?.value):value);r.onerror=()=>rej(r.error);});}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function markdown(s){let t=escapeHTML(s);t=t.replace(/```([\s\S]*?)```/g,(_,x)=>"<pre><code>"+x.trim()+"</code></pre>");t=t.replace(/`([^`]+)`/g,"<code>$1</code>");t=t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>");return t.split(/\n{2,}/).map(p=>p.startsWith("<pre>")?p:"<p>"+p.replace(/\n/g,"<br>")+"</p>").join("");}
function renderMessage(m){const el=document.createElement("article");el.className="message "+m.role;el.innerHTML=`<div class="avatar">${m.role==="user"?"Я":"✦"}</div><div class="bubble">${m.content?markdown(m.content):""}${(m.images||[]).map(src=>`<img src="${src}" alt="Прикреплённое изображение">`).join("")}</div>`;return el;}
function scrollBottom(){$("messages").scrollTop=$("messages").scrollHeight;}
async function renderChats(){const chats=await getAllChats();$("chatList").innerHTML="";for(const c of chats){const row=document.createElement("div");row.className="chat-item"+(c.id===currentChatId?" active":"");const title=document.createElement("div");title.className="chat-title";title.textContent=c.title||"Новый чат";title.onclick=()=>loadChat(c.id);const del=document.createElement("button");del.className="delete-chat";del.textContent="×";del.title="Удалить чат";del.onclick=async e=>{e.stopPropagation();if(confirm("Удалить этот чат без возможности восстановления?")){await removeChat(c.id);if(currentChatId===c.id){currentChatId=null;showWelcome();}await renderChats();}};row.append(title,del);$("chatList").append(row);}}
function showWelcome(){$("messages").innerHTML='<div class="welcome" id="welcome"><h1>Чем займёмся?</h1><p>Локальный чат с Claude. История остаётся на этом устройстве.</p></div>';}
async function loadChat(id){const chat=await getChat(id);if(!chat)return;currentChatId=id;$("messages").innerHTML="";chat.messages.forEach(m=>$("messages").append(renderMessage(m)));await renderChats();scrollBottom();$("sidebar").classList.remove("open");}
async function newChat(){currentChatId=null;showWelcome();await renderChats();$("prompt").focus();}
function setBusy(v){busy=v;$("sendBtn").disabled=v;$("sendBtn").textContent=v?"Думаю…":"Отправить ↑";$("status").textContent=v?"Claude отвечает…":"";}
function showPending(){ $("attachments").innerHTML="";pendingImages.forEach((im,i)=>{const d=document.createElement("div");d.className="attachment";d.innerHTML=`<img src="${im}" alt=""><button type="button" aria-label="Удалить">×</button>`;d.querySelector("button").onclick=()=>{pendingImages.splice(i,1);showPending();};$("attachments").append(d);});}
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement("canvas");canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",.82));};img.src=reader.result;};reader.readAsDataURL(file);});}
async function send(){if(busy)return;const text=$("prompt").value.trim();if(!text&&!pendingImages.length)return;
let chat=currentChatId?await getChat(currentChatId):null;if(!chat){chat={id:crypto.randomUUID(),title:(text||"Изображение").slice(0,42),createdAt:Date.now(),updatedAt:Date.now(),messages:[]};currentChatId=chat.id;}
const userMsg={role:"user",content:text,images:[...pendingImages]};chat.messages.push(userMsg);chat.updatedAt=Date.now();if(chat.messages.length===1&&text)chat.title=text.slice(0,42);
$("prompt").value="";pendingImages=[];showPending();$("messages").querySelector("#welcome")?.remove();$("messages").append(renderMessage(userMsg));const typing=document.createElement("article");typing.className="message";typing.innerHTML='<div class="avatar">✦</div><div class="bubble typing">Claude печатает…</div>';$("messages").append(typing);scrollBottom();await saveChat(chat);await renderChats();setBusy(true);
try{
 if (!ANTHROPIC_API_KEY || ANTHROPIC_API_KEY === "ВСТАВЬ_СЮДА_СВОЙ_КЛЮЧ") {
   throw new Error("Сначала вставь API-ключ в переменную ANTHROPIC_API_KEY в начале скрипта DucAI.html.");
 }
 const apiMessages = chat.messages.map(m => {
   const content = [];
   if (m.content) content.push({type:"text", text:m.content});
   for (const dataUrl of (m.images || [])) {
     const match = /^data:(image\/(?:jpeg|png|gif|webp));base64,([A-Za-z0-9+/=]+)$/.exec(dataUrl);
     if (match) content.push({type:"image", source:{type:"base64", media_type:match[1], data:match[2]}});
   }
   return {role:m.role, content:content.length ? content : [{type:"text",text:" "}]};
 });
 const response=await fetch("https://api.anthropic.com/v1/messages",{
   method:"POST",
   headers:{
     "content-type":"application/json",
     "x-api-key":ANTHROPIC_API_KEY,
     "anthropic-version":"2023-06-01",
     "anthropic-dangerous-direct-browser-access":"true"
   },
   body:JSON.stringify({model:ANTHROPIC_MODEL,max_tokens:4096,messages:apiMessages})
 });
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(data?.error?.message||("Anthropic API: HTTP "+response.status));
 const answer=Array.isArray(data.content)?data.content.filter(x=>x.type==="text").map(x=>x.text).join("\n"):"";
 if(!answer)throw new Error("Claude вернул пустой ответ.");
 const assistantMsg={role:"assistant",content:answer,images:[]};chat.messages.push(assistantMsg);chat.updatedAt=Date.now();await saveChat(chat);typing.replaceWith(renderMessage(assistantMsg));
}catch(err){typing.querySelector(".bubble").className="bubble";typing.querySelector(".bubble").textContent="Не удалось получить ответ: "+err.message+" Проверь, запущен ли локальный сервер."; }
finally{setBusy(false);await renderChats();scrollBottom();}
}
async function exportChats(){const chats=await getAllChats();const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),chats},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ducai-backup.json";a.click();URL.revokeObjectURL(a.href);}
async function init(){db=await openDB();const theme=await setting("theme");if(theme==="light"){document.documentElement.style.setProperty("--bg","#f4f4f7");document.documentElement.style.setProperty("--panel","#fff");document.documentElement.style.setProperty("--panel2","#e9e9ef");document.documentElement.style.setProperty("--line","#d8d8e0");document.documentElement.style.setProperty("--text","#20212a");document.documentElement.style.setProperty("--muted","#686b78");document.documentElement.style.setProperty("--assistant","#fff");document.documentElement.style.setProperty("--user","#eee9fa");document.body.style.colorScheme="light";}
await renderChats();}
$("newChat").onclick=newChat;$("sendBtn").onclick=send;$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});$("prompt").addEventListener("input",()=>{$("prompt").style.height="auto";$("prompt").style.height=Math.min($("prompt").scrollHeight,190)+"px";});
$("attachBtn").onclick=()=>$("fileInput").click();$("fileInput").onchange=async e=>{for(const f of [...e.target.files].slice(0,4-pendingImages.length)){if(f.type.startsWith("image/"))pendingImages.push(await compressImage(f));}showPending();e.target.value="";};
$("exportBtn").onclick=exportChats;$("menuBtn").onclick=()=>$("sidebar").classList.toggle("open");
$("themeBtn").onclick=async()=>{const next=(await setting("theme"))==="light"?"dark":"light";await setting("theme",next);location.reload();};
init().catch(e=>{console.error(e);$("status").textContent="Ошибка локального хранилища";});
})();
</script>
</body>
</html>
