<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DucAI — чат с Claude</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦆%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0f1115; --panel: #161a21; --panel2: #1d222b; --border: #2a303b;
    --text: #e8eaee; --muted: #8b94a3; --accent: #f5b301; --accent-text: #1a1400;
    --user: #26303f; --ai: #1a1f27; --danger: #ef4444;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --radius: 14px;
  }
  [data-theme="green"]  { --bg:#0b130e; --panel:#101b14; --panel2:#16251b; --border:#233a2a; --accent:#22c55e; --accent-text:#03140a; --user:#15321f; --ai:#101b14; }
  [data-theme="blue"]   { --bg:#0b1020; --panel:#111830; --panel2:#18213f; --border:#26325c; --accent:#3b82f6; --accent-text:#fff; --user:#172552; --ai:#111830; }
  [data-theme="cyan"]   { --bg:#07131a; --panel:#0c1e28; --panel2:#112a37; --border:#1d4152; --accent:#22d3ee; --accent-text:#03181d; --user:#0f3342; --ai:#0c1e28; }
  [data-theme="red"]    { --bg:#160a0b; --panel:#201012; --panel2:#2b1618; --border:#4a2326; --accent:#ef4444; --accent-text:#fff; --user:#3d1518; --ai:#201012; }
  /* КОДОВЫЕ ТЕМЫ — стиль терминала */
  [data-code="1"] {
    --font: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Consolas, "Courier New", monospace;
    --radius: 2px; --bg:#050505; --panel:#0a0a0a; --panel2:#101010; --ai:#080808;
    --text: var(--accent); --muted: color-mix(in srgb, var(--accent) 55%, #000);
  }
  [data-theme="red-code"]   { --accent:#ff3b3b; --accent-text:#000; --border:#4a1212; --user:#1a0707; }
  [data-theme="blue-code"]  { --accent:#4da3ff; --accent-text:#000; --border:#123456; --user:#07131f; }
  [data-theme="green-code"] { --accent:#39ff14; --accent-text:#000; --border:#14500a; --user:#07140a; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  /* Эффект ЭЛТ для кодовых тем */
  [data-code="1"] body::after, body[data-code="1"]::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 3px);
  }
  body[data-code="1"] { text-shadow: 0 0 6px color-mix(in srgb, var(--accent) 35%, transparent); }
  body[data-code="1"] .logo-text::after { content: "▌"; animation: blink 1s steps(2) infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- Авторизация ---------- */
  #auth { min-height: 100%; display: grid; place-items: center; padding: 20px; }
  .auth-card { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--border); border-radius: calc(var(--radius) + 6px); padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 26px; justify-content: center; margin-bottom: 4px; }
  .brand span.duck { font-size: 32px; }
  .tagline { text-align: center; color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: var(--radius); padding: 4px; margin-bottom: 18px; border: 1px solid var(--border); }
  .tab { background: none; border: 0; padding: 9px; border-radius: calc(var(--radius) - 3px); color: var(--muted); font-weight: 600; }
  .tab.active { background: var(--accent); color: var(--accent-text); }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
  input.t { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 13px; outline: none; }
  input.t:focus { border-color: var(--accent); }
  .btn { background: var(--accent); color: var(--accent-text); border: 0; border-radius: var(--radius); padding: 11px 16px; font-weight: 700; }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.block { width: 100%; margin-top: 18px; }
  .btn.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border); font-weight: 600; }
  .form-error { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 12px; }

  /* ---------- Приложение ---------- */
  #app { height: 100%; display: flex; }
  aside { width: 288px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .side-top { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; }
  #chatList { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .chat-item { display: flex; align-items: center; gap: 6px; padding: 9px 10px; border-radius: var(--radius); cursor: pointer; color: var(--muted); }
  .chat-item:hover { background: var(--panel2); color: var(--text); }
  .chat-item.active { background: var(--panel2); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
  .chat-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-item .del { background: none; border: 0; color: var(--muted); opacity: 0; padding: 2px 6px; border-radius: 6px; }
  .chat-item:hover .del, .chat-item.active .del { opacity: 1; }
  .chat-item .del:hover { color: var(--danger); }
  .empty-list { color: var(--muted); padding: 14px; font-size: 13px; text-align: center; }
  .side-bottom { border-top: 1px solid var(--border); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .limits { font-size: 12.5px; color: var(--muted); display: grid; gap: 3px; }
  .limits b { color: var(--text); }
  .me-row { display: flex; align-items: center; gap: 8px; }
  .me-name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  .row-btns { display: flex; gap: 8px; }
  .row-btns .btn { flex: 1; padding: 8px 10px; font-size: 13.5px; }
  .badge { width: 18px; height: 18px; flex-shrink: 0; display: inline-block; vertical-align: -3px; }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { display: none; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .topbar .menu { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; font-size: 18px; }
  #messages { flex: 1; overflow-y: auto; padding: 24px 16px 8px; scroll-behavior: smooth; }
  .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .welcome { text-align: center; margin-top: 12vh; color: var(--muted); }
  .welcome .big { font-size: 56px; }
  .welcome h2 { color: var(--text); margin: 8px 0 6px; }
  .msg { display: flex; flex-direction: column; max-width: 88%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .msg .who { display: none; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  body[data-code="1"] .msg .who { display: block; }
  .bubble { padding: 10px 14px; border-radius: var(--radius); background: var(--ai); border: 1px solid var(--border); overflow-wrap: anywhere; }
  .msg.user .bubble { background: var(--user); }
  .msg.error .bubble { border-color: var(--danger); color: var(--danger); }
  .bubble p { margin: 0; }
  .bubble code.inline { background: rgba(127,127,127,.2); padding: 1px 5px; border-radius: 5px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92em; }
  .codeblock { position: relative; margin: 8px 0; background: #07090c; border: 1px solid var(--border); border-radius: calc(var(--radius) - 4px); }
  .codeblock .lang { font-size: 11px; color: var(--muted); padding: 5px 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .codeblock .copy { background: none; border: 0; color: var(--muted); font-size: 11px; }
  .codeblock .copy:hover { color: var(--text); }
  .codeblock pre { margin: 0; padding: 10px; overflow-x: auto; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: #d7dde8; text-shadow: none; }
  body[data-code="1"] .codeblock pre { color: var(--accent); }
  .imgs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; justify-content: flex-end; }
  .imgs img { max-width: 220px; max-height: 180px; border-radius: 10px; border: 1px solid var(--border); cursor: zoom-in; object-fit: cover; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }

  .composer { padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); }
  .composer-inner { max-width: 820px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: calc(var(--radius) + 4px); padding: 8px; }
  .composer-inner:focus-within { border-color: var(--accent); }
  #previews { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 4px 8px; }
  .prev { position: relative; }
  .prev img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); display: block; }
  .prev button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: var(--danger); color: #fff; font-size: 12px; line-height: 1; padding: 0; }
  .input-row { display: flex; align-items: flex-end; gap: 6px; }
  #input { flex: 1; resize: none; background: none; border: 0; outline: none; padding: 9px 8px; max-height: 200px; min-height: 40px; }
  .icon-btn { background: var(--panel2); border: 1px solid var(--border); border-radius: var(--radius); width: 40px; height: 40px; display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
  .icon-btn:hover { border-color: var(--accent); }
  .send { background: var(--accent); color: var(--accent-text); border: 0; font-weight: 800; }
  .send:disabled { opacity: .5; cursor: not-allowed; }
  .hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* Модалки */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: grid; place-items: center; z-index: 100; padding: 16px; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: calc(var(--radius) + 6px); padding: 22px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 4px; }
  .modal p.sub { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .theme-opt { display: flex; align-items: center; gap: 10px; background: var(--panel2); border: 2px solid var(--border); border-radius: var(--radius); padding: 10px; text-align: left; }
  .theme-opt.active { border-color: var(--accent); }
  .theme-opt.locked { opacity: .55; }
  .sw { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; border: 2px solid rgba(255,255,255,.15); }
  .theme-opt small { display: block; color: var(--muted); font-size: 11px; }
  .lightbox { cursor: zoom-out; }
  .lightbox img { max-width: 95vw; max-height: 92vh; border-radius: 10px; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--accent); color: var(--text); padding: 11px 18px; border-radius: var(--radius); z-index: 200; max-width: 90vw; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .loading-screen { height: 100%; display: grid; place-items: center; color: var(--muted); }

  ::-webkit-scrollbar { width: 9px; height: 9px; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9px; }

  @media (max-width: 800px) {
    aside { position: fixed; z-index: 50; top: 0; bottom: 0; left: 0; transform: translateX(-100%); transition: transform .2s; width: 290px; }
    aside.open { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.55); }
    .topbar { display: flex; }
    .msg { max-width: 96%; }
    .welcome { margin-top: 6vh; }
  }
</style>
</head>
<body>

<div class="loading-screen" id="loading">Загрузка…</div>

<!-- ======================= АВТОРИЗАЦИЯ ======================= -->
<div id="auth" hidden>
  <div class="auth-card">
    <div class="brand"><span class="duck">🦆</span> DucAI</div>
    <p class="tagline">Общайтесь с Claude. Ваши диалоги сохраняются на сервере.</p>
    <div class="tabs">
      <button class="tab active" id="tabLogin" type="button">Вход</button>
      <button class="tab" id="tabReg" type="button">Регистрация</button>
    </div>
    <form id="authForm" autocomplete="on">
      <label class="f" for="aLogin">Логин</label>
      <input class="t" id="aLogin" name="username" autocomplete="username" maxlength="32" required />
      <label class="f" for="aPass">Пароль</label>
      <input class="t" id="aPass" name="password" type="password" autocomplete="current-password" required />
      <div id="pass2Wrap" hidden>
        <label class="f" for="aPass2">Пароль ещё раз</label>
        <input class="t" id="aPass2" name="password2" type="password" autocomplete="new-password" />
      </div>
      <div class="form-error" id="authError"></div>
      <button class="btn block" id="authSubmit" type="submit">Войти</button>
    </form>
  </div>
</div>

<!-- ======================= ПРИЛОЖЕНИЕ ======================= -->
<div id="app" hidden>
  <aside id="sidebar">
    <div class="side-top">
      <div class="logo"><span>🦆</span><span class="logo-text">DucAI</span></div>
      <button class="btn" id="newChatBtn" type="button">＋ Новый чат</button>
    </div>
    <div id="chatList"></div>
    <div class="side-bottom">
      <div class="limits" id="limits"></div>
      <div class="me-row"><div class="me-name" id="meName"></div></div>
      <div class="row-btns">
        <button class="btn ghost" id="themeBtn" type="button">🎨 Темы</button>
        <button class="btn ghost" id="logoutBtn" type="button">Выйти</button>
      </div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <button class="menu" id="menuBtn" type="button">☰</button>
      <div class="logo"><span>🦆</span><span class="logo-text">DucAI</span></div>
    </div>
    <div id="messages"><div class="wrap" id="wrap"></div></div>
    <div class="composer">
      <div class="composer-inner">
        <div id="previews" hidden></div>
        <div class="input-row">
          <button class="icon-btn" id="attachBtn" type="button" title="Прикрепить фото">📎</button>
          <input type="file" id="fileInput" accept="image/*" multiple hidden />
          <textarea id="input" rows="1" placeholder="Напишите сообщение…"></textarea>
          <button class="icon-btn send" id="sendBtn" type="button" title="Отправить">➤</button>
        </div>
      </div>
      <div class="hint">Enter — отправить, Shift+Enter — новая строка</div>
    </div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toast" hidden></div>

<script>
/* ==========================================================================
   НАСТРОЙКА: адрес вашего бэкенда.
   - Если страница открыта прямо с бэкенда — оставьте пустую строку "".
   - Если страница лежит на GitHub Pages — впишите URL бэкенда, например
     "https://my-ducai-backend.example.com" (без слэша в конце).
   ========================================================================== */
const API_BASE = "https://ducai.vercel.app";

/* Локально хранится только токен сессии (ключ входа). Пользователи, чаты,
   сообщения, лимиты и темы — всё хранится на сервере в базе данных. */
const TOKEN_KEY = "ducai_session_token";

const THEMES = [
  { id: "default",    name: "Стандартная",   color: "#f5b301", free: true },
  { id: "green",      name: "Зелёная",       color: "#22c55e" },
  { id: "blue",       name: "Синяя",         color: "#3b82f6" },
  { id: "cyan",       name: "Голубая",       color: "#22d3ee" },
  { id: "red",        name: "Красная",       color: "#ef4444" },
  { id: "red-code",   name: "Красная кодовая", color: "#ff3b3b", code: true },
  { id: "blue-code",  name: "Синий кодовый",  color: "#4da3ff", code: true },
  { id: "green-code", name: "Зелёный кодовый", color: "#39ff14", code: true },
];

const $ = (id) => document.getElementById(id);
const state = { me: null, chats: [], chatId: null, messages: [], pending: [], busy: false };

const BADGE = '<svg class="badge" viewBox="0 0 24 24" aria-label="Синяя галочка" role="img"><title>Подтверждённый аккаунт</title><path fill="#1d9bf0" d="M22.5 12.5c0-1.58-.88-2.95-2.18-3.66.54-1.4.23-3.05-.89-4.17-1.12-1.12-2.77-1.43-4.17-.89C14.55 2.48 13.18 1.6 11.6 1.6S8.65 2.48 7.94 3.78c-1.4-.54-3.05-.23-4.17.89-1.12 1.12-1.43 2.77-.89 4.17C1.58 9.55.7 10.92.7 12.5s.88 2.95 2.18 3.66c-.54 1.4-.23 3.05.89 4.17 1.12 1.12 2.77 1.43 4.17.89.71 1.3 2.08 2.18 3.66 2.18s2.95-.88 3.66-2.18c1.4.54 3.05.23 4.17-.89 1.12-1.12 1.43-2.77.89-4.17 1.3-.71 2.18-2.08 2.18-3.66z" transform="translate(.4 -.5)"/><path fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M7.6 12.3l3 3 5.8-6.2"/></svg>';

/* ---------------- Утилиты ---------------- */
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function toast(msg, ms = 3800) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), ms);
}

async function api(path, { method = "GET", body } = {}) {
  const headers = {};
  const token = localStorage.getItem(TOKEN_KEY);
  if (token) headers["Authorization"] = "Bearer " + token;
  if (body !== undefined) headers["Content-Type"] = "application/json";
  let res;
  try {
    res = await fetch(API_BASE + path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  } catch (e) {
    throw new Error("Нет связи с сервером. Проверьте API_BASE в DucAI.html и подключение к интернету.");
  }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error((data && data.error) || "Ошибка сервера (" + res.status + ")");
    err.status = res.status;
    throw err;
  }
  return data;
}

function renderInline(text) {
  let s = esc(text);
  s = s.replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\n/g, "<br>");
  return s;
}
function renderMd(src) {
  const parts = String(src).split("```");
  let html = "";
  parts.forEach((p, i) => {
    if (i % 2 === 1) {
      const nl = p.indexOf("\n");
      const lang = nl >= 0 ? p.slice(0, nl).trim() : "";
      const code = nl >= 0 ? p.slice(nl + 1) : p;
      html += '<div class="codeblock"><div class="lang"><span>' + esc(lang || "code") + '</span><button class="copy" type="button">Копировать</button></div><pre>' + esc(code.replace(/\n$/, "")) + "</pre></div>";
    } else if (p) {
      html += "<p>" + renderInline(p) + "</p>";
    }
  });
  return html;
}

/* ---------------- Темы ---------------- */
function applyTheme(id) {
  const t = THEMES.find((x) => x.id === id) || THEMES[0];
  document.documentElement.setAttribute("data-theme", t.id);
  document.documentElement.setAttribute("data-code", t.code ? "1" : "0");
  document.body.setAttribute("data-code", t.code ? "1" : "0");
}

function openThemes() {
  const verified = state.me.verified;
  const cur = state.me.theme;
  const root = $("modalRoot");
  root.innerHTML = '<div class="overlay" id="thOv"><div class="modal"><h3>🎨 Темы оформления</h3><p class="sub">' +
    (verified ? "Выберите тему — она сохранится в вашем аккаунте." : "Все темы кроме стандартной доступны только обладателям синей галочки " + "✓") +
    '</p><div class="theme-grid">' +
    THEMES.map((t) => {
      const locked = !t.free && !verified;
      return '<button type="button" class="theme-opt' + (t.id === cur ? " active" : "") + (locked ? " locked" : "") + '" data-id="' + t.id + '"><span class="sw" style="background:' + t.color + '"></span><span>' + esc(t.name) + "<small>" + (locked ? "🔒 нужна галочка" : t.code ? "стиль кодинга" : "") + "</small></span></button>";
    }).join("") +
    '</div><button class="btn ghost block" id="thClose" type="button">Закрыть</button></div></div>';
  $("thClose").onclick = () => (root.innerHTML = "");
  $("thOv").onclick = (e) => { if (e.target.id === "thOv") root.innerHTML = ""; };
  root.querySelectorAll(".theme-opt").forEach((b) => {
    b.onclick = async () => {
      const id = b.dataset.id;
      const t = THEMES.find((x) => x.id === id);
      if (!t.free && !verified) return toast("🔒 Эта тема доступна только с синей галочкой");
      try {
        const me = await api("/api/me", { method: "PATCH", body: { theme: id } });
        state.me = me; applyTheme(me.theme); renderMe(); openThemes();
      } catch (e) { toast(e.message); }
    };
  });
}

/* ---------------- Авторизация ---------------- */
let authMode = "login";
function setAuthMode(m) {
  authMode = m;
  $("tabLogin").classList.toggle("active", m === "login");
  $("tabReg").classList.toggle("active", m === "reg");
  $("pass2Wrap").hidden = m !== "reg";
  $("aPass2").required = m === "reg";
  $("aPass").autocomplete = m === "reg" ? "new-password" : "current-password";
  $("authSubmit").textContent = m === "reg" ? "Зарегистрироваться" : "Войти";
  $("authError").textContent = "";
}
$("tabLogin").onclick = () => setAuthMode("login");
$("tabReg").onclick = () => setAuthMode("reg");

$("authForm").onsubmit = async (e) => {
  e.preventDefault();
  const btn = $("authSubmit"); btn.disabled = true; $("authError").textContent = "";
  try {
    const login = $("aLogin").value.trim(), password = $("aPass").value;
    let data;
    if (authMode === "reg") {
      data = await api("/api/auth/register", { method: "POST", body: { login, password, password2: $("aPass2").value } });
    } else {
      data = await api("/api/auth/login", { method: "POST", body: { login, password } });
    }
    localStorage.setItem(TOKEN_KEY, data.token);
    $("aPass").value = ""; $("aPass2").value = "";
    await enterApp();
  } catch (err) {
    $("authError").textContent = err.message;
  } finally { btn.disabled = false; }
};

function showAuth() {
  $("loading").hidden = true; $("app").hidden = true; $("auth").hidden = false;
  applyTheme("default"); setAuthMode("login");
}

$("logoutBtn").onclick = async () => {
  try { await api("/api/auth/logout", { method: "POST" }); } catch (e) {}
  localStorage.removeItem(TOKEN_KEY);
  Object.assign(state, { me: null, chats: [], chatId: null, messages: [], pending: [] });
  showAuth();
};

/* ---------------- Приложение ---------------- */
async function enterApp() {
  state.me = await api("/api/me");
  applyTheme(state.me.theme);
  $("loading").hidden = true; $("auth").hidden = true; $("app").hidden = false;
  renderMe();
  await loadChats();
  newDraft();
}

function renderMe() {
  const m = state.me;
  $("meName").innerHTML = "<span>" + esc(m.login) + "</span>" + (m.verified ? BADGE : "");
  const l = m.limits;
  $("limits").innerHTML =
    "<div>Новых чатов сегодня: <b>" + l.chatsUsed + (l.chatsLimit === null ? " / ∞" : " / " + l.chatsLimit) + "</b></div>" +
    "<div>Фото сегодня: <b>" + l.imagesUsed + (l.imagesLimit === null ? " / ∞" : " / " + l.imagesLimit) + "</b></div>" +
    (m.verified ? "<div>✓ Безлимит и все темы</div>" : "");
}

async function loadChats() {
  const d = await api("/api/chats");
  state.chats = d.chats;
  renderChats();
}

function renderChats() {
  const el = $("chatList");
  if (!state.chats.length) { el.innerHTML = '<div class="empty-list">Пока нет диалогов</div>'; return; }
  el.innerHTML = state.chats.map((c) =>
    '<div class="chat-item' + (c.id === state.chatId ? " active" : "") + '" data-id="' + c.id + '"><span class="title">💬 ' + esc(c.title) + '</span><button class="del" type="button" title="Удалить" data-del="' + c.id + '">✕</button></div>'
  ).join("");
}

$("chatList").onclick = async (e) => {
  const del = e.target.closest("[data-del]");
  if (del) {
    e.stopPropagation();
    if (!confirm("Удалить этот чат?")) return;
    try {
      await api("/api/chats/" + del.dataset.del, { method: "DELETE" });
      if (Number(del.dataset.del) === state.chatId) newDraft();
      await loadChats();
    } catch (err) { toast(err.message); }
    return;
  }
  const item = e.target.closest(".chat-item");
  if (item) openChat(Number(item.dataset.id));
};

function newDraft() {
  state.chatId = null; state.messages = [];
  renderChats(); renderMessages();
  $("sidebar").classList.remove("open");
  $("input").focus();
}
$("newChatBtn").onclick = newDraft;
$("menuBtn").onclick = () => $("sidebar").classList.toggle("open");

async function openChat(id) {
  try {
    const d = await api("/api/chats/" + id);
    state.chatId = id; state.messages = d.messages;
    renderChats(); renderMessages();
    $("sidebar").classList.remove("open");
  } catch (e) { toast(e.message); }
}

function msgHtml(m) {
  const who = m.role === "user" ? esc(state.me.login) + "@ducai:~$" : "ducai>";
  let h = '<div class="msg ' + m.role + (m.error ? " error" : "") + '"><div class="who">' + who + "</div>";
  if (m.images && m.images.length) h += '<div class="imgs">' + m.images.map((s) => '<img src="' + s + '" alt="фото" />').join("") + "</div>";
  if (m.typing) h += '<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
  else if (m.content) h += '<div class="bubble">' + (m.role === "assistant" ? renderMd(m.content) : "<p>" + renderInline(m.content) + "</p>") + "</div>";
  return h + "</div>";
}

function renderMessages() {
  const w = $("wrap");
  if (!state.messages.length) {
    w.innerHTML = '<div class="welcome"><div class="big">🦆</div><h2>Привет, ' + esc(state.me ? state.me.login : "") + '!</h2><div>Я DucAI. Спросите что угодно или прикрепите фото.</div></div>';
  } else {
    w.innerHTML = state.messages.map(msgHtml).join("");
  }
  const sc = $("messages"); sc.scrollTop = sc.scrollHeight;
}

$("wrap").onclick = (e) => {
  const img = e.target.closest(".imgs img");
  if (img) {
    const root = $("modalRoot");
    root.innerHTML = '<div class="overlay lightbox"><img src="' + img.src + '" alt="" /></div>';
    root.firstChild.onclick = () => (root.innerHTML = "");
    return;
  }
  const cp = e.target.closest(".copy");
  if (cp) {
    const code = cp.closest(".codeblock").querySelector("pre").textContent;
    navigator.clipboard.writeText(code).then(() => { cp.textContent = "Скопировано ✓"; setTimeout(() => (cp.textContent = "Копировать"), 1500); });
  }
};

/* ---------------- Фото ---------------- */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("Не удалось прочитать файл"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Это не изображение"));
      img.onload = () => {
        const max = 1280;
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.82));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function imagesLeft() {
  const l = state.me.limits;
  return l.imagesLimit === null ? Infinity : Math.max(0, l.imagesLimit - l.imagesUsed);
}

$("attachBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = async (e) => {
  const files = Array.from(e.target.files); e.target.value = "";
  for (const f of files) {
    if (state.pending.length >= 5) { toast("Не более 5 фото в одном сообщении"); break; }
    if (state.pending.length + 1 > imagesLeft()) { toast("📷 Лимит фото на сегодня исчерпан. Получите синюю галочку для безлимита."); break; }
    try { state.pending.push(await compressImage(f)); } catch (err) { toast(err.message); }
  }
  renderPreviews();
};

function renderPreviews() {
  const p = $("previews");
  p.hidden = !state.pending.length;
  p.innerHTML = state.pending.map((s, i) => '<div class="prev"><img src="' + s + '" alt="" /><button type="button" data-i="' + i + '">✕</button></div>').join("");
}
$("previews").onclick = (e) => {
  const b = e.target.closest("button[data-i]");
  if (b) { state.pending.splice(Number(b.dataset.i), 1); renderPreviews(); }
};

/* ---------------- Отправка ---------------- */
const input = $("input");
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("sendBtn").onclick = send;

async function send() {
  if (state.busy) return;
  const text = input.value.trim();
  const images = state.pending.slice();
  if (!text && !images.length) return;

  state.busy = true; $("sendBtn").disabled = true;
  input.value = ""; input.style.height = "auto"; state.pending = []; renderPreviews();

  let createdHere = false;
  const typing = { role: "assistant", content: "", typing: true };
  try {
    if (state.chatId === null) {
      const d = await api("/api/chats", { method: "POST" });
      state.chatId = d.chat.id; createdHere = true;
      state.chats.unshift(d.chat); renderChats();
    }
    state.messages.push({ role: "user", content: text, images }, typing);
    renderMessages();
    const chatId = state.chatId;
    const d = await api("/api/chats/" + chatId + "/messages", { method: "POST", body: { text, images } });
    state.messages = state.messages.filter((m) => m !== typing);
    if (state.chatId === chatId) { state.messages.push(d.message); renderMessages(); }
    state.me.limits = d.limits; renderMe();
    await loadChats();
  } catch (err) {
    if (err.status === 401) { localStorage.removeItem(TOKEN_KEY); toast("Сессия истекла. Войдите снова."); showAuth(); state.busy = false; $("sendBtn").disabled = false; return; }
    // откат: убираем сообщение пользователя, возвращаем текст и фото в поле ввода
    state.messages = state.messages.filter((m) => m !== typing);
    state.messages.pop();
    input.value = text; state.pending = images; renderPreviews();
    input.dispatchEvent(new Event("input"));
    if (createdHere) {
      try { await api("/api/chats/" + state.chatId, { method: "DELETE" }); } catch (e) {}
      state.chatId = null; state.messages = [];
      await loadChats().catch(() => {});
    }
    renderMessages();
    toast(err.message, 6000);
    try { state.me = await api("/api/me"); renderMe(); } catch (e) {}
  } finally {
    state.busy = false; $("sendBtn").disabled = false; input.focus();
  }
}

$("themeBtn").onclick = openThemes;

/* ---------------- Старт ---------------- */
(async function init() {
  applyTheme("default");
  if (!localStorage.getItem(TOKEN_KEY)) return showAuth();
  try { await enterApp(); }
  catch (e) {
    if (e.status === 401) localStorage.removeItem(TOKEN_KEY);
    showAuth();
    if (e.status !== 401) $("authError").textContent = e.message;
  }
})();
</script>
