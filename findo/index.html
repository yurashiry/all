<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Findo — Поисковая система нового поколения</title>
  <meta name="description" content="Findo — быстрая и красивая поисковая система в стиле iOS 27 Liquid Glass." />
  <meta name="theme-color" content="#05070D" />

  <!-- Шрифты Inter и Plus Jakarta Sans для округлого логотипа -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    :root {
      --bg-deep: #05070D;
      --accent-blue: #2F6BFF;
      --accent-cyan: #3DD6F5;
      --glass-bg: rgba(255, 255, 255, 0.055);
      --glass-bg-hover: rgba(255, 255, 255, 0.095);
      --glass-bg-strong: rgba(13, 20, 38, 0.72);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-bright: rgba(255, 255, 255, 0.24);
      --glass-highlight: inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.28), inset 0 -1px 1px 0 rgba(47, 107, 255, 0.12);
      --glass-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.75), 0 0 35px -10px rgba(47, 107, 255, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg-deep);
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      selection-background-color: rgba(61, 214, 245, 0.3);
    }

    ::selection {
      background: rgba(61, 214, 245, 0.28);
      color: #ffffff;
    }

    /* ==========================================================
       ФОНОВЫЕ ДИАГОНАЛЬНЫЕ БЛИКИ (Стиль референса Findo)
       ========================================================== */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: #05070D;
    }

    /* Главный диагональный луч слева-снизу вправо-вверх */
    .ambient-beam-1 {
      position: absolute;
      width: 150vw;
      height: 36vh;
      top: 28%;
      left: -25vw;
      transform: rotate(-32deg);
      background: linear-gradient(
        90deg,
        rgba(61, 214, 245, 0) 0%,
        rgba(61, 214, 245, 0.22) 22%,
        rgba(47, 107, 255, 0.32) 52%,
        rgba(61, 214, 245, 0.18) 78%,
        rgba(5, 7, 13, 0) 100%
      );
      filter: blur(65px);
      animation: beamFloat 14s ease-in-out infinite alternate;
    }

    /* Тонкая яркая диагональная световая грань (каустика) */
    .ambient-beam-caustic {
      position: absolute;
      width: 145vw;
      height: 3px;
      top: 44%;
      left: -20vw;
      transform: rotate(-32deg);
      background: linear-gradient(
        90deg,
        transparent 5%,
        rgba(61, 214, 245, 0.55) 25%,
        rgba(47, 107, 255, 0.65) 55%,
        rgba(61, 214, 245, 0.45) 82%,
        transparent 96%
      );
      box-shadow: 0 0 40px 8px rgba(61, 214, 245, 0.35), 0 0 80px 20px rgba(47, 107, 255, 0.35);
      filter: blur(2px);
      opacity: 0.65;
      animation: causticPulse 10s ease-in-out infinite alternate;
    }

    /* Вторичный мягкий бирюзовый блик справа сверху */
    .ambient-orb-top {
      position: absolute;
      width: 680px;
      height: 680px;
      top: -240px;
      right: -160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(47, 107, 255, 0.22) 0%, rgba(61, 214, 245, 0.08) 45%, transparent 72%);
      filter: blur(55px);
    }

    /* Мягкий циановый блик слева снизу */
    .ambient-orb-bottom {
      position: absolute;
      width: 640px;
      height: 640px;
      bottom: -240px;
      left: -160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(61, 214, 245, 0.2) 0%, rgba(47, 107, 255, 0.1) 45%, transparent 72%);
      filter: blur(60px);
    }

    @keyframes beamFloat {
      0% { transform: rotate(-32deg) translateY(-12px) scaleY(0.96); }
      100% { transform: rotate(-30.5deg) translateY(16px) scaleY(1.06); }
    }

    @keyframes causticPulse {
      0% { opacity: 0.45; transform: rotate(-32deg) translateY(-6px); }
      100% { opacity: 0.78; transform: rotate(-31deg) translateY(8px); }
    }

    /* ==========================================================
       LIQUID GLASS (iOS 27 СТИЛЬ)
       ========================================================== */
    .liquid-glass {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.085) 0%, rgba(255, 255, 255, 0.03) 100%);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-highlight), var(--glass-shadow);
      border-radius: 32px;
      transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .liquid-glass-interactive:hover {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.12) 0%, rgba(47, 107, 255, 0.07) 100%);
      border-color: var(--glass-border-bright);
      box-shadow:
        inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.4),
        inset 0 -1px 2px 0 rgba(61, 214, 245, 0.2),
        0 24px 55px -12px rgba(0, 0, 0, 0.85),
        0 0 32px -6px rgba(61, 214, 245, 0.25);
      transform: translateY(-2px);
    }

    .liquid-glass-pill {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.035) 100%);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.26), 0 10px 28px -8px rgba(0, 0, 0, 0.6);
      border-radius: 9999px;
      transition: all 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .liquid-glass-pill:hover {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.14) 0%, rgba(61, 214, 245, 0.09) 100%);
      border-color: rgba(255, 255, 255, 0.24);
      transform: translateY(-1px);
    }

    .liquid-glass-pill.active {
      background: linear-gradient(135deg, rgba(47, 107, 255, 0.55) 0%, rgba(61, 214, 245, 0.42) 100%);
      border-color: rgba(61, 214, 245, 0.65);
      box-shadow:
        inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.48),
        0 8px 25px -4px rgba(47, 107, 255, 0.45),
        0 0 20px -2px rgba(61, 214, 245, 0.35);
      color: #ffffff;
    }

    /* Строка поиска с подсветкой при фокусе */
    .search-capsule {
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.095) 0%, rgba(255, 255, 255, 0.035) 100%);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow:
        inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.32),
        inset 0 -1px 1px 0 rgba(47, 107, 255, 0.12),
        0 22px 55px -12px rgba(0, 0, 0, 0.78),
        0 0 40px -10px rgba(47, 107, 255, 0.22);
      border-radius: 9999px;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .search-capsule:focus-within {
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.12) 0%, rgba(47, 107, 255, 0.07) 100%);
      border-color: rgba(61, 214, 245, 0.6);
      box-shadow:
        inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.45),
        0 25px 65px -10px rgba(0, 0, 0, 0.88),
        0 0 0 4px rgba(47, 107, 255, 0.18),
        0 0 45px -4px rgba(61, 214, 245, 0.35);
      transform: translateY(-1px);
    }

    /* Акцентная кнопка-капсула «Найти» */
    .btn-findo-primary {
      background: linear-gradient(135deg, #2F6BFF 0%, #3DD6F5 100%);
      color: #ffffff;
      font-weight: 600;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.32);
      box-shadow:
        inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.48),
        0 10px 26px -6px rgba(47, 107, 255, 0.65),
        0 0 22px -4px rgba(61, 214, 245, 0.45);
      transition: all 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }

    .btn-findo-primary:hover {
      filter: brightness(1.09);
      transform: translateY(-1px) scale(1.015);
      box-shadow:
        inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.6),
        0 14px 32px -4px rgba(47, 107, 255, 0.8),
        0 0 30px -2px rgba(61, 214, 245, 0.65);
    }

    .btn-findo-primary:active {
      transform: translateY(0) scale(0.985);
    }

    /* Стеклянный инпут в модальном окне */
    .glass-input {
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9999px;
      color: #ffffff;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35), inset 0 1px 0.5px rgba(255, 255, 255, 0.12);
      transition: all 0.22s ease;
    }

    .glass-input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.085);
      border-color: #3DD6F5;
      box-shadow: 0 0 0 3px rgba(61, 214, 245, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.25);
    }

    /* Оформление логотипа из файла logo.png (чтобы чёрный фон картинки мягко растворялся в Liquid Glass) */
    .logo-img-blend {
      mix-blend-mode: screen;
      -webkit-mask-image: radial-gradient(ellipse 74% 66% at 50% 50%, #000 58%, transparent 98%);
      mask-image: radial-gradient(ellipse 74% 66% at 50% 50%, #000 58%, transparent 98%);
      filter: drop-shadow(0 0 24px rgba(47, 107, 255, 0.35));
      user-select: none;
      pointer-events: none;
    }

    .findo-wordmark {
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(180deg, #FFFFFF 15%, #D9EEFF 68%, #99D5FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 18px rgba(47, 107, 255, 0.42)) drop-shadow(0 0 2px rgba(255, 255, 255, 0.5));
    }

    /* ==========================================================
       ПОЛНАЯ ПЕРЕКРАСКА GOOGLE CSE ПОД ТЕМУ LIQUID GLASS (!important)
       Никаких белых блоков, прозрачные фоны, стеклянные карточки
       ========================================================== */
    .gsc-control-cse,
    .gsc-control-cse .gsc-table-result,
    .gsc-control-wrapper-cse,
    .gsc-resultsbox-visible,
    .gsc-resultsRoot,
    .gsc-results,
    .gsc-webResult,
    .gs-webResult,
    .gsc-imageResult,
    .gsc-expansionArea,
    .gsc-table-result,
    .gsc-table-result tr,
    .gsc-table-result td,
    .gs-result,
    .gsc-thumbnail-inside,
    .gsc-url-top,
    .gsc-result-info-container,
    .gsc-above-wrapper-area,
    .gsc-above-wrapper-area-container,
    .gsc-adBlock {
      background: transparent !important;
      background-color: transparent !important;
      border: none !important;
      color: #F8FAFC !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
      box-shadow: none !important;
    }

    .gsc-control-cse {
      padding: 0 !important;
      margin: 0 !important;
    }

    /* Скрываем стандартные внутренние вкладки и сортировку CSE, так как у нас свои стеклянные пилюли */
    .gsc-tabsArea,
    .gsc-tabsAreaInvisible,
    .gsc-refinementsArea,
    .gsc-above-wrapper-area,
    .gcsc-find-more-on-google-root,
    .gcsc-more-maybe-branding-root,
    .gsc-branding {
      display: none !important;
    }

    /* Каждая карточка результата в Google CSE = Liquid Glass Card */
    .gsc-webResult.gsc-result {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.075) 0%, rgba(255, 255, 255, 0.025) 100%) !important;
      backdrop-filter: blur(30px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(30px) saturate(180%) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      border-radius: 30px !important;
      padding: 22px 26px !important;
      margin-bottom: 16px !important;
      box-shadow:
        inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.25),
        0 18px 42px -12px rgba(0, 0, 0, 0.72) !important;
      transition: all 0.26s cubic-bezier(0.22, 1, 0.36, 1) !important;
    }

    .gsc-webResult.gsc-result:hover {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.115) 0%, rgba(47, 107, 255, 0.065) 100%) !important;
      border-color: rgba(61, 214, 245, 0.35) !important;
      transform: translateY(-2px) !important;
      box-shadow:
        inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.38),
        0 22px 48px -10px rgba(0, 0, 0, 0.82),
        0 0 30px -8px rgba(61, 214, 245, 0.25) !important;
    }

    /* Заголовки ссылок в Google CSE */
    .gs-webResult.gs-result a.gs-title:link,
    .gs-webResult.gs-result a.gs-title:visited,
    .gs-webResult.gs-result a.gs-title b,
    .gs-imageResult a.gs-title:link,
    .gs-imageResult a.gs-title:visited,
    .gsc-result .gs-title,
    .gsc-result .gs-title * {
      color: #3DD6F5 !important;
      font-size: 1.16rem !important;
      line-height: 1.45 !important;
      font-weight: 600 !important;
      text-decoration: none !important;
      transition: color 0.2s ease !important;
    }

    .gs-webResult.gs-result a.gs-title:hover,
    .gs-webResult.gs-result a.gs-title:hover b {
      color: #7CE8FF !important;
      text-decoration: underline !important;
    }

    /* Домен и хлебные крошки в Google CSE */
    .gsc-url-top,
    .gs-visibleUrl,
    .gs-visibleUrl-short,
    .gs-visibleUrl-long,
    .gs-visibleUrl-breadcrumb,
    .gs-visibleUrl-breadcrumb span {
      color: rgba(148, 163, 184, 0.9) !important;
      font-size: 0.85rem !important;
      margin-bottom: 4px !important;
    }

    /* Текст сниппета в Google CSE */
    .gs-webResult .gs-snippet,
    .gs-imageResult .gs-snippet,
    .gs-fileFormatType {
      color: rgba(241, 245, 249, 0.84) !important;
      font-size: 0.95rem !important;
      line-height: 1.62 !important;
      margin-top: 6px !important;
    }

    /* Выделенные слова совпадений в сниппетах */
    .gs-webResult .gs-snippet b,
    .gs-visibleUrl b {
      color: #FFFFFF !important;
      font-weight: 600 !important;
      background: rgba(61, 214, 245, 0.14) !important;
      padding: 0 4px !important;
      border-radius: 6px !important;
    }

    /* Миниатюры картинок внутри результатов Google CSE */
    .gs-web-image-box,
    .gs-promotion-image-box {
      margin-right: 16px !important;
      border-radius: 18px !important;
      overflow: hidden !important;
      border: 1px solid rgba(255, 255, 255, 0.14) !important;
      background: rgba(255, 255, 255, 0.04) !important;
      padding: 0 !important;
    }

    .gs-web-image-box img.gs-image,
    .gs-promotion-image-box img.gs-promotion-image {
      border-radius: 18px !important;
      object-fit: cover !important;
      border: none !important;
    }

    /* Сетка картинок Google CSE */
    .gsc-imageResult {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%) !important;
      backdrop-filter: blur(30px) saturate(180%) !important;
      border: 1px solid rgba(255, 255, 255, 0.14) !important;
      border-radius: 28px !important;
      padding: 10px !important;
      margin: 8px !important;
      overflow: hidden !important;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25), 0 14px 32px rgba(0, 0, 0, 0.65) !important;
      transition: transform 0.25s ease, border-color 0.25s ease !important;
    }

    .gsc-imageResult:hover {
      transform: translateY(-3px) scale(1.02) !important;
      border-color: rgba(61, 214, 245, 0.5) !important;
    }

    .gsc-imageResult .gs-image-box,
    .gsc-imageResult img {
      border-radius: 20px !important;
    }

    /* Пагинация Google CSE в виде круглых стеклянных пилюль */
    .gsc-cursor-box {
      margin-top: 28px !important;
      text-align: center !important;
      border: none !important;
    }

    .gsc-cursor {
      display: inline-flex !important;
      flex-wrap: wrap !important;
      gap: 10px !important;
      justify-content: center !important;
      align-items: center !important;
    }

    .gsc-cursor-page {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 42px !important;
      height: 42px !important;
      border-radius: 9999px !important;
      background: rgba(255, 255, 255, 0.07) !important;
      border: 1px solid rgba(255, 255, 255, 0.14) !important;
      color: #E2E8F0 !important;
      font-weight: 600 !important;
      font-size: 0.92rem !important;
      text-decoration: none !important;
      margin: 0 !important;
      transition: all 0.22s ease !important;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2) !important;
    }

    .gsc-cursor-page:hover {
      background: rgba(61, 214, 245, 0.2) !important;
      border-color: #3DD6F5 !important;
      color: #FFFFFF !important;
      transform: translateY(-1px) !important;
    }

    .gsc-cursor-current-page {
      background: linear-gradient(135deg, #2F6BFF, #3DD6F5) !important;
      border-color: rgba(255, 255, 255, 0.45) !important;
      color: #FFFFFF !important;
      box-shadow: 0 8px 20px -4px rgba(47, 107, 255, 0.65) !important;
    }

    /* Пустой результат или сообщения Google CSE */
    .gs-no-results-result .gs-snippet,
    .gs-error-result .gs-snippet {
      background: rgba(255, 255, 255, 0.06) !important;
      border: 1px solid rgba(255, 255, 255, 0.14) !important;
      border-radius: 28px !important;
      padding: 24px !important;
      color: #F8FAFC !important;
    }

    /* Попап просмотра картинок в Google CSE */
    .gsc-modal-background-image {
      background-color: rgba(5, 7, 13, 0.85) !important;
      backdrop-filter: blur(20px) !important;
    }

    .gsc-lightBox {
      background: rgba(15, 23, 42, 0.88) !important;
      border: 1px solid rgba(255, 255, 255, 0.16) !important;
      border-radius: 32px !important;
    }

    /* Скелетон-анимация */
    @keyframes shimmerGlow {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .skeleton-bar {
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(61,214,245,0.14) 50%, rgba(255,255,255,0.04) 75%);
      background-size: 200% 100%;
      animation: shimmerGlow 1.8s infinite linear;
      border-radius: 9999px;
    }

    /* Скроллбар */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #05070D;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(61, 214, 245, 0.4);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col relative selection:bg-cyan-400/30 selection:text-white">

  <!-- ============================================================
       1. ФОНОВЫЕ ДИАГОНАЛЬНЫЕ БЛИКИ (iOS 27 Liquid Space)
       ============================================================ -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-orb-top"></div>
    <div class="ambient-beam-1"></div>
    <div class="ambient-beam-caustic"></div>
    <div class="ambient-orb-bottom"></div>
  </div>

  <!-- ============================================================
       2. ПЛАШКА БЕЗОПАСНОГО РЕЖИМА (показывается если firebaseConfig пуст или при критическом сбое)
       ============================================================ -->
  <div id="safe-mode-banner" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 liquid-glass-pill border border-amber-400/35 text-amber-200 text-xs sm:text-sm font-medium flex items-center gap-2.5 shadow-2xl">
    <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse shrink-0"></span>
    <span>Безопасный-режим: обнаружены критические ошибки</span>
    <button id="safe-mode-info-btn" type="button" class="ml-1 text-amber-300/80 hover:text-white underline text-xs cursor-pointer">Подробнее</button>
  </div>

  <!-- ============================================================
       3. ОСНОВНОЙ КОНТЕЙНЕР ПРИЛОЖЕНИЯ
       ============================================================ -->
  <div id="app" class="relative z-10 flex-1 flex flex-col w-full">

    <!-- ==================== ВЕРХНЯЯ ПАНЕЛЬ НА ГЛАВНОЙ ==================== -->
    <header id="home-header" class="w-full max-w-7xl mx-auto px-4 sm:px-8 pt-5 pb-2 flex items-center justify-between">

                  <!-- Градиент стеклянного обода лупы -->
                  <linearGradient id="findoGlassRing" x1="12" y1="10" x2="95" y2="98" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#E0F6FF" />
                    <stop offset="22%" stop-color="#48A9FF" />
                    <stop offset="60%" stop-color="#2F6BFF" />
                    <stop offset="88%" stop-color="#3DD6F5" />

                    <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.15" />

                <path d="M25 32C31 23 41 18 52 18" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.85" />
                <path d="M68 76C73 72 77 67 79 61" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.75" />

                <!-- Четырёхконечная звезда внутри лупы -->
                <path

                  d="M52 33C53.6 44.2 55.8 46.4 67 48C55.8 49.6 53.6 51.8 52 63C50.4 51.8 48.2 49.6 37 48C48.2 46.4 50.4 44.2 52 33Z"

          </div>
        </div>

        <!-- БОЛЬШАЯ СТЕКЛЯННАЯ СТРОКА ПОИСКА -->
        <form id="home-search-form" class="w-full relative" autocomplete="off">
          <div class="search-capsule w-full p-2 sm:p-2.5 pl-5 sm:pl-7 flex items-center gap-3">
            <!-- Иконка лупы со звездой -->
            <div class="text-cyan-400 shrink-0 flex items-center justify-center">

        </div>

        <!-- Быстрые капсулы-примеры (чтобы можно было протестировать поиск в 1 клик) -->

  <!-- ============================================================
       7. ГЛАВНЫЙ СКРИПТ FINDO (Конфиги вверху + Модульный код)
       ============================================================ -->
  <script type="module">
    /* =========================================================================
       КОНФИГУРАЦИЯ ПОИСКА (Смена провайдера занимает одну строку конфига)
       provider: 'google-cse' | 'custom'
       ========================================================================= */
    const SEARCH = { provider: 'google-cse', cx: '223fb158bd2b34da9', proxyUrl: '' };

    /* =========================================================================
       КОНФИГУРАЦИЯ FIREBASE AUTH (FINDO ID)
       Вставьте сюда свои данные из консоли Firebase (Project Settings -> Web App).
       Если оставить поля apiKey / projectId пустыми, автоматически включится
       Безопасный демо-режим (вход в памяти без сервера).
       ========================================================================= */
    const firebaseConfig = {
      apiKey: "AIzaSyBGlZjiMeY9UYPggMtwPZns9shsfZF0RNQ",
      authDomain: "findo-89583.firebaseapp.com",
      projectId: "findo-89583",
      storageBucket: "findo-89583.firebasestorage.app",
      messagingSenderId: "897425018538",
      appId: "1:897425018538:web:c59a3e58bc719e6daecad3",
      measurementId: "G-H6FP01S63S"
    };

    // Подключение Firebase Modular SDK v10 через официальный CDN gstatic
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAnalytics, isSupported as isAnalyticsSupported } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signInWithPopup,
      GoogleAuthProvider,
      sendPasswordResetEmail,
      signOut,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    /* =========================================================================
       СОСТОЯНИЕ ПРИЛОЖЕНИЯ
       ========================================================================= */
    const state = {
      currentUser: null,
      isSafeDemoMode: false,
      authMode: 'login', // 'login' | 'register'
      authInstance: null,
      cseLoaded: false,
      cseReady: false,
      pendingQuery: null,
      pendingTab: 'all'
    };

    /* =========================================================================
       ПРОВЕРКА ПРИЛОЖЕННОГО ФАЙЛА logo.png
       Если logo.png существует и загружается — показываем его, иначе inline SVG
       ========================================================================= */
    function initLogoAsset() {
      const img = document.getElementById('home-logo-img');
      const imgWrap = document.getElementById('home-logo-img-wrap');
      const svgWrap = document.getElementById('home-logo-svg-wrap');
      if (!img) return;

      img.onload = () => {
        if (img.naturalWidth > 0) {
          imgWrap.classList.remove('hidden');
          imgWrap.classList.add('flex');
          svgWrap.classList.add('hidden');
        }
      };
      img.onerror = () => {
        imgWrap.classList.add('hidden');
        svgWrap.classList.remove('hidden');
        svgWrap.classList.add('flex');
      };
    }

    /* =========================================================================
       БЕЗОПАСНАЯ РАБОТА С LOCALSTORAGE (История запросов для вошедших)
       ========================================================================= */
    function getHistoryStorageKey() {
      const uid = state.currentUser?.uid || state.currentUser?.email || 'guest';
      return `findo_history_${uid}`;
    }

    function loadRecentQueries() {
      if (!state.currentUser) return [];
      try {
        const raw = localStorage.getItem(getHistoryStorageKey());
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (err) {
        console.warn('Ошибка чтения localStorage:', err);
        return [];
      }
    }

    function saveQueryToHistory(query) {
      if (!state.currentUser || !query || !query.trim()) return;
      const clean = query.trim();
      try {
        const list = loadRecentQueries().filter(item => item.toLowerCase() !== clean.toLowerCase());
        list.unshift(clean);
        const trimmed = list.slice(0, 10);
        localStorage.setItem(getHistoryStorageKey(), JSON.stringify(trimmed));
      } catch (err) {
        console.warn('Ошибка записи в localStorage:', err);
      }
      renderRecentSearches();
    }

    function removeQueryFromHistory(query) {
      if (!state.currentUser) return;
      try {
        const list = loadRecentQueries().filter(item => item !== query);
        localStorage.setItem(getHistoryStorageKey(), JSON.stringify(list));
      } catch (err) {
        console.warn('Ошибка обновления localStorage:', err);
      }
      renderRecentSearches();
    }

    function clearUserHistory() {
      if (!state.currentUser) return;
      try {
        localStorage.removeItem(getHistoryStorageKey());
      } catch (err) {
        console.warn('Ошибка очистки localStorage:', err);
      }
      renderRecentSearches();
    }

    function renderRecentSearches() {
      const box = document.getElementById('recent-searches-box');
      const listEl = document.getElementById('recent-searches-list');
      const countEl = document.getElementById('dropdown-history-count');

      const queries = loadRecentQueries();
      if (countEl) countEl.textContent = String(queries.length);

      if (!state.currentUser || queries.length === 0) {
        box.classList.add('hidden');
        return;
      }

      box.classList.remove('hidden');
      listEl.innerHTML = '';

      queries.forEach(q => {
        const item = document.createElement('div');
        item.className = 'liquid-glass-pill pl-4 pr-2 py-1.5 text-xs sm:text-sm text-slate-100 flex items-center gap-2 group';

        const textBtn = document.createElement('button');
        textBtn.type = 'button';
        textBtn.className = 'hover:text-cyan-300 transition cursor-pointer flex items-center gap-1.5 text-left';
        textBtn.innerHTML = `<span class="text-cyan-400/80">↻</span><span></span>`;
        textBtn.querySelector('span:last-child').textContent = q;
        textBtn.addEventListener('click', () => navigateToSearch(q, 'all'));

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'w-5 h-5 rounded-full hover:bg-white/15 text-slate-400 hover:text-white flex items-center justify-center transition cursor-pointer';
        delBtn.title = 'Удалить из истории';
        delBtn.innerHTML = '✕';
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          removeQueryFromHistory(q);
        });

        item.appendChild(textBtn);
        item.appendChild(delBtn);
        listEl.appendChild(item);
      });
    }

    /* =========================================================================
       РОУТИНГ И ОТРИСОВКА ЭКРАНОВ: renderHome / renderResults
       ========================================================================= */
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const q = (params.get('q') || '').trim();
      const tab = (params.get('tab') || 'all').toLowerCase();
      const validTabs = ['all', 'images', 'video', 'news'];
      return {
        q,
        tab: validTabs.includes(tab) ? tab : 'all'
      };
    }

    function navigateToSearch(query, tab = 'all', replace = false) {
      const cleanQ = (query || '').trim();
      if (!cleanQ) {
        navigateHome();
        return;
      }

      const url = new URL(window.location.href);
      url.searchParams.set('q', cleanQ);
      url.searchParams.set('tab', tab || 'all');

      if (replace) {
        window.history.replaceState({ q: cleanQ, tab }, '', url.toString());
      } else {
        window.history.pushState({ q: cleanQ, tab }, '', url.toString());
      }

      saveQueryToHistory(cleanQ);
      renderResults(cleanQ, tab);
    }

    function navigateHome() {
      const url = new URL(window.location.href);
      url.search = '';
      window.history.pushState({}, '', url.toString());
      renderHome();
    }

    /**
     * 1) Отрисовка Главной страницы (нет параметра q)
     */
    function renderHome() {
      document.title = 'Findo — Поисковая система';
      document.getElementById('home-header').classList.remove('hidden');
      document.getElementById('view-home').classList.remove('hidden');
      document.getElementById('view-results').classList.add('hidden');
      document.getElementById('view-results').classList.remove('flex');

      const homeInput = document.getElementById('home-search-input');
      if (homeInput) {
        homeInput.value = '';
        toggleClearButton('home-search-input', 'home-clear-btn');
      }

      renderRecentSearches();
      updateProviderBadges();
    }

    /**
     * 2) Отрисовка Страницы результатов (есть параметр q)
     */
    function renderResults(query, tab = 'all') {
      document.title = `${query} — Поиск Findo`;
      document.getElementById('home-header').classList.add('hidden');
      document.getElementById('view-home').classList.add('hidden');

      const resultsView = document.getElementById('view-results');
      resultsView.classList.remove('hidden');
      resultsView.classList.add('flex');

      const resultsInput = document.getElementById('results-search-input');
      if (resultsInput && resultsInput.value !== query) {
        resultsInput.value = query;
      }
      toggleClearButton('results-search-input', 'results-clear-btn');

      // Подсветка активной пилюли-вкладки
      document.querySelectorAll('.search-tab-pill').forEach(btn => {
        const isCurrent = btn.getAttribute('data-tab') === tab;
        btn.classList.toggle('active', isCurrent);
      });

      const tabNames = {
        all: 'Все результаты',
        images: 'Картинки',
        video: 'Видео',
        news: 'Новости'
      };
      document.getElementById('search-tab-indicator').textContent = tabNames[tab] || 'Все результаты';

      updateProviderBadges();
      runSearch(query, tab);
    }

    /* =========================================================================
       ПОИСКОВЫЙ ДВИЖОК: runSearch (google-cse и custom)
       ========================================================================= */
    function updateProviderBadges() {
      const isGoogle = SEARCH.provider === 'google-cse';
      const labelHome = document.getElementById('provider-label');
      const labelResults = document.getElementById('results-provider-badge');
      if (labelHome) labelHome.textContent = isGoogle ? 'Google CSE' : 'Custom JSON';
      if (labelResults) labelResults.textContent = `Провайдер: ${SEARCH.provider}`;
    }

    /**
     * Главная функция запуска поиска по текущему провайдеру из конфига SEARCH
     */
    async function runSearch(query, tab = 'all') {
      const statusText = document.getElementById('search-status-text');
      const googleWrapper = document.getElementById('google-cse-wrapper');
      const customWrapper = document.getElementById('custom-results-wrapper');
      const skeleton = document.getElementById('results-skeleton');

      if (SEARCH.provider === 'google-cse') {
        customWrapper.classList.add('hidden');
        googleWrapper.classList.remove('hidden');
        statusText.innerHTML = `Результаты по запросу <span class="text-white font-semibold">«${escapeHtml(query)}»</span>`;
        runGoogleCseSearch(query, tab);
      } else {
        googleWrapper.classList.add('hidden');
        customWrapper.classList.remove('hidden');
        statusText.innerHTML = `Поиск по запросу <span class="text-white font-semibold">«${escapeHtml(query)}»</span>...`;
        await runCustomProviderSearch(query, tab);
      }
    }

    /* -------------------------------------------------------------------------
       ПРОВАЙДЕР 1: GOOGLE CUSTOM SEARCH ENGINE (google-cse)
       ------------------------------------------------------------------------- */
    function ensureGoogleCseLoaded() {
      if (state.cseLoaded) return;
      state.cseLoaded = true;

      window.__gcse = {
        parsetags: 'onload',
        initializationCallback: () => {
          state.cseReady = true;
          renderAndExecuteCseElement();
        }
      };

      const script = document.createElement('script');
      script.src = `https://cse.google.com/cse.js?cx=${encodeURIComponent(SEARCH.cx)}`;
      script.async = true;
      script.onerror = () => {
        const skeleton = document.getElementById('results-skeleton');
        skeleton.classList.add('hidden');
      };
      document.head.appendChild(script);
    }

    function renderAndExecuteCseElement() {
      if (!window.google || !window.google.search || !window.google.search.cse) return;
      const p = window.google.search.cse.element;
      if (!p) return;

      let el = p.getElement('findo-cse-results') || p.getElement('searchresults-only0');

      if (!el) {
        try {
          p.go('cse-slot-container');
          el = p.getElement('findo-cse-results') || p.getElement('searchresults-only0');
        } catch (e) {
          console.warn('CSE go error:', e);
        }
      }

      if (state.pendingQuery && el) {
        executeQueryOnCseElement(el, state.pendingQuery, state.pendingTab);
      }
    }

    function executeQueryOnCseElement(el, query, tab) {
      const skeleton = document.getElementById('results-skeleton');

      // Формируем запрос с учётом выбранной вкладки (Все, Картинки, Видео, Новости)
      let effectiveQuery = query;
      if (tab === 'video') {
        effectiveQuery = `${query} видео`;
      } else if (tab === 'news') {
        effectiveQuery = `${query} новости`;
      }

      try {
        el.execute(effectiveQuery);
      } catch (e) {
        console.warn('Ошибка вызова cse.execute:', e);
      }

      // Переключаем внутренний режим (Веб / Картинки) в виджете CSE, если он отрендерен
      setTimeout(() => {
        skeleton.classList.add('hidden');
        const tabHeaders = document.querySelectorAll('.gsc-tabHeader');
        if (tabHeaders && tabHeaders.length >= 2) {
          if (tab === 'images') {
            tabHeaders[1].click();
          } else {
            tabHeaders[0].click();
          }
        }
      }, 450);
    }

    function runGoogleCseSearch(query, tab) {
      state.pendingQuery = query;
      state.pendingTab = tab;

      const skeleton = document.getElementById('results-skeleton');
      skeleton.classList.remove('hidden');

      ensureGoogleCseLoaded();

      if (state.cseReady && window.google?.search?.cse?.element) {
        const p = window.google.search.cse.element;
        const el = p.getElement('findo-cse-results') || p.getElement('searchresults-only0');
        if (el) {
          executeQueryOnCseElement(el, query, tab);
          return;
        }
        renderAndExecuteCseElement();
      }
    }

    /* -------------------------------------------------------------------------
       ПРОВАЙДЕР 2: CUSTOM SEARCH (GET `${proxyUrl}?q=...&tab=...`)
       Формат ответа: { results: [{ title, url, snippet, favicon, image }] }
       ------------------------------------------------------------------------- */
    async function runCustomProviderSearch(query, tab) {
      const skeleton = document.getElementById('results-skeleton');
      const listEl = document.getElementById('custom-results-list');
      const gridEl = document.getElementById('custom-images-grid');
      const statusText = document.getElementById('search-status-text');

      listEl.innerHTML = '';
      gridEl.innerHTML = '';
      gridEl.classList.add('hidden');
      listEl.classList.remove('hidden');
      skeleton.classList.remove('hidden');

      try {
        let data = null;

        if (SEARCH.proxyUrl && SEARCH.proxyUrl.trim() !== '') {
          // Строгий запрос по ТЗ: GET `${proxyUrl}?q=...&tab=...`
          const separator = SEARCH.proxyUrl.includes('?') ? '&' : '?';
          const endpoint = `${SEARCH.proxyUrl}${separator}q=${encodeURIComponent(query)}&tab=${encodeURIComponent(tab)}`;
          const response = await fetch(endpoint, {
            method: 'GET',
            headers: { 'Accept': 'application/json' }
          });
          if (!response.ok) {
            throw new Error(`Сервер вернул код ${response.status}`);
          }
          data = await response.json();
        } else {
          // Если proxyUrl ещё не указан, получаем живые результаты из открытого API Wikipedia / Wikimedia Commons в том же формате {results:[{title,url,snippet,favicon,image}]}
          data = await fetchLiveFallbackCustomResults(query, tab);
        }

        skeleton.classList.add('hidden');
        const results = Array.isArray(data?.results) ? data.results : [];

        if (results.length === 0) {
          statusText.innerHTML = `По запросу <span class="text-white font-semibold">«${escapeHtml(query)}»</span> ничего не найдено`;
          renderCustomEmptyState(query);
          return;
        }

        statusText.innerHTML = `Найдено результатов: <span class="text-white font-semibold">${results.length}</span> по запросу <span class="text-cyan-300 font-semibold">«${escapeHtml(query)}»</span>`;

        if (tab === 'images') {
          listEl.classList.add('hidden');
          gridEl.classList.remove('hidden');
          gridEl.classList.add('grid');
          renderCustomImageTiles(results);
        } else {
          gridEl.classList.add('hidden');
          gridEl.classList.remove('grid');
          listEl.classList.remove('hidden');
          renderCustomCards(results, tab);
        }
      } catch (err) {
        skeleton.classList.add('hidden');
        statusText.textContent = 'Ошибка при выполнении запроса';
        renderCustomErrorState(err.message || 'Не удалось подключиться к поисковому прокси');
      }
    }

    /**
     * Живой поиск для режима custom, когда proxyUrl пустой (возвращает строгую структуру {results:[{title,url,snippet,favicon,image}]})
     */
    async function fetchLiveFallbackCustomResults(query, tab) {
      if (tab === 'images') {
        const commonsUrl = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrnamespace=6&gsrlimit=12&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=640&format=json&origin=*`;
        const res = await fetch(commonsUrl);
        const json = await res.json();
        const pages = json?.query?.pages ? Object.values(json.query.pages) : [];
        const results = pages
          .filter(p => p.imageinfo && p.imageinfo[0]?.thumburl)
          .map(p => {
            const info = p.imageinfo[0];
            const cleanTitle = (p.title || '').replace(/^File:/i, '').replace(/\.[^.]+$/, '');
            return {
              title: cleanTitle,
              url: info.descriptionurl || info.url,
              snippet: info.extmetadata?.ImageDescription?.value?.replace(/<[^>]*>/g, '') || cleanTitle,
              favicon: 'https://commons.wikimedia.org/favicon.ico',
              image: info.thumburl || info.url
            };
          });
        return { results };
      }

      const suffix = tab === 'video' ? ' видео' : tab === 'news' ? ' новости' : '';
      const wikiUrl = `https://ru.wikipedia.org/w/api.php?action=query&prop=pageimages|extracts&exintro=1&explaintext=1&exsentences=3&piprop=thumbnail&pithumbsize=480&generator=search&gsrsearch=${encodeURIComponent(query + suffix)}&gsrlimit=8&format=json&origin=*`;
      const res = await fetch(wikiUrl);
      const json = await res.json();
      const pages = json?.query?.pages ? Object.values(json.query.pages) : [];

      const results = pages.map(p => ({
        title: p.title,
        url: `https://ru.wikipedia.org/?curid=${p.pageid}`,
        snippet: p.extract || 'Описание страницы в энциклопедии.',
        favicon: 'https://ru.wikipedia.org/favicon.ico',
        image: p.thumbnail?.source || ''
      }));

      return { results };
    }

    /**
     * Отрисовка собственных стеклянных карточек: favicon, домен, заголовок-ссылка, сниппет

          : '';

        card.innerHTML = `
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2.5 mb-2">
              <img src="${escapeHtml(faviconUrl)}" alt="" class="w-5 h-5 rounded-full bg-white/10 p-0.5 object-contain shrink-0" onerror="this.style.display='none'" />
              <span class="text-xs text-slate-300 font-medium truncate">${escapeHtml(domain)}</span>

            </div>
            <a

    /* =========================================================================
       АВТОРИЗАЦИЯ FINDO ID: initAuth (Firebase v10 + Безопасный демо-режим)
       ========================================================================= */
    function translateFirebaseError(error) {
      const code = error?.code || '';
      switch (code) {
        case 'auth/invalid-email':
          return 'Указан некорректный адрес электронной почты.';
        case 'auth/user-disabled':
          return 'Этот аккаунт был отключён администратором.';
        case 'auth/user-not-found':
        case 'auth/invalid-credential':
        case 'auth/wrong-password':
          return 'Неверный email или пароль. Проверьте введённые данные.';
        case 'auth/email-already-in-use':
          return 'Этот email уже зарегистрирован. Попробуйте войти.';
        case 'auth/weak-password':
          return 'Слишком простой пароль — используйте минимум 6 символов.';
        case 'auth/too-many-requests':
          return 'Слишком много попыток входа. Пожалуйста, подождите пару минут.';
        case 'auth/popup-closed-by-user':
          return 'Окно входа через Google было закрыто до завершения авторизации.';
        case 'auth/popup-blocked':
          return 'Браузер заблокировал всплывающее окно. Разрешите всплывающие окна для сайта.';
        case 'auth/unauthorized-domain':
          return 'Текущий домен превью не добавлен в список разрешённых в Firebase Console. Активирован безопасный локальный вход.';
        case 'auth/network-request-failed':
          return 'Ошибка сети. Проверьте подключение к интернету.';
        default:
          return error?.message || 'Произошла ошибка при авторизации. Попробуйте ещё раз.';
      }
    }

    /**
     * Инициализация Firebase Auth или автоматический переход в Безопасный демо-режим
     */
    function initAuth() {
      const isConfigEmpty =
        !firebaseConfig ||
        !firebaseConfig.apiKey ||
        firebaseConfig.apiKey.trim() === '' ||
        !firebaseConfig.projectId ||
        firebaseConfig.projectId.trim() === '';

      if (isConfigEmpty) {
        enableSafeDemoMode();
        renderAuthTriggers();
        return;
      }

      try {
        const app = initializeApp(firebaseConfig);
        isAnalyticsSupported().then(yes => {
          if (yes) getAnalytics(app);
        }).catch(() => {});
        const auth = getAuth(app);
        state.authInstance = auth;

        onAuthStateChanged(
          auth,
          (user) => {
            state.currentUser = user
              ? {
                  uid: user.uid,
                  email: user.email || '',
                  displayName: user.displayName || (user.email ? user.email.split('@')[0] : 'Пользователь'),
                  photoURL: user.photoURL || ''
                }
              : null;

            renderAuthTriggers();
            renderRecentSearches();
          },
          (error) => {
            console.warn('Ошибка слушателя Firebase Auth:', error);
            enableSafeDemoMode();
            renderAuthTriggers();
          }
        );
      } catch (err) {
        console.warn('Критическая ошибка инициализации Firebase:', err);
        enableSafeDemoMode();
        renderAuthTriggers();
      }
    }

              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />

    /* =========================================================================
       ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ И СОБЫТИЯ ИНТЕРФЕЙСА
       ========================================================================= */
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getInitials(nameOrEmail) {
      const clean = (nameOrEmail || 'F').trim();
      const parts = clean.split(/\s+/);
      if (parts.length >= 2) {
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }
      return clean.slice(0, 2).toUpperCase();
    }

    function toggleClearButton(inputId, btnId) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      if (!input || !btn) return;
      if (input.value.trim().length > 0) {
        btn.classList.remove('hidden');
        btn.classList.add('flex');
      } else {
        btn.classList.add('hidden');
        btn.classList.remove('flex');
      }
    }

    function bindEvents() {
      // Отправка формы поиска на Главной
      document.getElementById('home-search-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const q = document.getElementById('home-search-input').value.trim();
        if (q) navigateToSearch(q, 'all');
      });

      // Отправка формы поиска на Странице результатов
      document.getElementById('results-search-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const q = document.getElementById('results-search-input').value.trim();
        const { tab } = getUrlParams();
        if (q) navigateToSearch(q, tab);
      });

      // Кнопки очистки инпутов
      document.getElementById('home-search-input').addEventListener('input', () => {
        toggleClearButton('home-search-input', 'home-clear-btn');
      });
      document.getElementById('home-clear-btn').addEventListener('click', () => {
        const inp = document.getElementById('home-search-input');
        inp.value = '';
        toggleClearButton('home-search-input', 'home-clear-btn');
        inp.focus();
      });

      document.getElementById('results-search-input').addEventListener('input', () => {
        toggleClearButton('results-search-input', 'results-clear-btn');
      });
      document.getElementById('results-clear-btn').addEventListener('click', () => {
        const inp = document.getElementById('results-search-input');
        inp.value = '';
        toggleClearButton('results-search-input', 'results-clear-btn');
        inp.focus();
      });

      // Клик по логотипу на странице результатов -> на Главную
      document.getElementById('results-home-link').addEventListener('click', (e) => {
        e.preventDefault();
        navigateHome();
      });

      // Переключение пилюль-вкладок (Все, Картинки, Видео, Новости)
      document.querySelectorAll('.search-tab-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          const newTab = btn.getAttribute('data-tab') || 'all';
          const { q } = getUrlParams();
          const currentInputQ = document.getElementById('results-search-input').value.trim() || q;
          if (currentInputQ) {
            navigateToSearch(currentInputQ, newTab);
          }
        });
      });

      // Быстрые капсулы популярных запросов на главной
      document.querySelectorAll('.quick-query-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          const q = pill.getAttribute('data-quick-q');
          if (q) navigateToSearch(q, 'all');
        });
      });

      // Переключатель провайдера (позволяет протестировать 'google-cse' и 'custom' на лету)
      const toggleProvider = () => {
        SEARCH.provider = SEARCH.provider === 'google-cse' ? 'custom' : 'google-cse';
        updateProviderBadges();
        const { q, tab } = getUrlParams();
        if (q) runSearch(q, tab);
      };
      document.getElementById('provider-toggle-btn')?.addEventListener('click', toggleProvider);
      document.getElementById('results-provider-switch')?.addEventListener('click', toggleProvider);

      // Кнопки Назад / Вперёд браузера
      window.addEventListener('popstate', () => {
        const { q, tab } = getUrlParams();
        if (q) {
          renderResults(q, tab);
        } else {
          renderHome();
        }
      });

      // Модальное окно Findo ID
      document.getElementById('auth-modal-close').addEventListener('click', closeAuthModal);
      document.getElementById('auth-modal-backdrop').addEventListener('click', (e) => {
        if (e.target.id === 'auth-modal-backdrop') closeAuthModal();
      });

      document.getElementById('tab-login-btn').addEventListener('click', () => {
        state.authMode = 'login';
        hideAuthAlert();
        syncAuthModalTabs();
      });
      document.getElementById('tab-register-btn').addEventListener('click', () => {
        state.authMode = 'register';
        hideAuthAlert();
        syncAuthModalTabs();
      });

      // Показать/скрыть пароль
      document.getElementById('toggle-password-vis').addEventListener('click', () => {
        const passInput = document.getElementById('auth-password');
        passInput.type = passInput.type === 'password' ? 'text' : 'password';
      });

      // Отправка формы Вход / Регистрация
      document.getElementById('auth-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAuthAlert();

        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        const name = document.getElementById('auth-name').value.trim();
        const submitBtn = document.getElementById('auth-submit-btn');

        if (!email || !password) {
          showAuthAlert('Пожалуйста, заполните email и пароль.');
          return;
        }

        if (state.isSafeDemoMode || !state.authInstance) {
          performDemoLogin(email, name);
          return;
        }

        submitBtn.disabled = true;
        try {
          if (state.authMode === 'login') {
            await signInWithEmailAndPassword(state.authInstance, email, password);
          } else {
            const cred = await createUserWithEmailAndPassword(state.authInstance, email, password);
            if (name && cred.user) {
              await updateProfile(cred.user, { displayName: name });
              state.currentUser = {
                ...state.currentUser,
                displayName: name
              };
              renderAuthTriggers();
            }
          }
          closeAuthModal();
        } catch (err) {
          if (err?.code === 'auth/unauthorized-domain' || err?.code === 'auth/operation-not-allowed') {
            showAuthAlert(translateFirebaseError(err));
            setTimeout(() => performDemoLogin(email, name), 1100);
          } else {
            showAuthAlert(translateFirebaseError(err));
          }
        } finally {
          submitBtn.disabled = false;
        }
      });

      // Вход через Google (signInWithPopup)
      document.getElementById('google-signin-btn').addEventListener('click', async () => {
        hideAuthAlert();
        if (state.isSafeDemoMode || !state.authInstance) {
          performDemoLogin('google.user@findo.app', 'Google Пользователь');
          return;
        }

        try {
          const provider = new GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          await signInWithPopup(state.authInstance, provider);
          closeAuthModal();
        } catch (err) {
          if (err?.code === 'auth/unauthorized-domain' || err?.code === 'auth/operation-not-supported-in-this-environment') {
            showAuthAlert('Домен превью не авторизован для OAuth-попапа в Firebase. Выполнен вход в безопасном режиме.');
            setTimeout(() => performDemoLogin('google.user@findo.app', 'Google Пользователь'), 1200);
          } else {
            showAuthAlert(translateFirebaseError(err));
          }
        }
      });

      // Сброс пароля (sendPasswordResetEmail)
      document.getElementById('forgot-password-btn').addEventListener('click', async () => {
        hideAuthAlert();
        const email = document.getElementById('auth-email').value.trim();
        if (!email) {
          showAuthAlert('Введите ваш email в поле выше, чтобы мы отправили ссылку для сброса пароля.');
          document.getElementById('auth-email').focus();
          return;
        }

        if (state.isSafeDemoMode || !state.authInstance) {
          showAuthAlert(`В безопасном режиме письмо для ${email} симулировано. Вы можете войти с любым паролем.`, 'success');
          return;
        }

        try {
          await sendPasswordResetEmail(state.authInstance, email);
          showAuthAlert(`Письмо для восстановления пароля отправлено на ${email}. Проверьте входящие!`, 'success');
        } catch (err) {
          showAuthAlert(translateFirebaseError(err));
        }
      });

      // Выход из аккаунта
      document.getElementById('logout-btn').addEventListener('click', async () => {
        document.getElementById('profile-dropdown').classList.add('hidden');
        if (state.authInstance && !state.isSafeDemoMode) {
          try {
            await signOut(state.authInstance);
          } catch (e) {
            console.warn('Ошибка выхода:', e);
          }
        }
        state.currentUser = null;
        renderAuthTriggers();
        renderRecentSearches();
      });

      // Очистка истории
      document.getElementById('clear-history-btn')?.addEventListener('click', clearUserHistory);
      document.getElementById('dropdown-clear-history')?.addEventListener('click', () => {
        clearUserHistory();
        document.getElementById('profile-dropdown').classList.add('hidden');
      });

      // Закрытие выпадающего меню профиля при клике вне
      document.addEventListener('click', (e) => {
        const dd = document.getElementById('profile-dropdown');
        if (!dd || dd.classList.contains('hidden')) return;
        if (!dd.contains(e.target)) {
          dd.classList.add('hidden');
        }
      });

      // Закрытие лайтбокса картинки
      document.getElementById('lightbox-close')?.addEventListener('click', () => {
        document.getElementById('image-lightbox').classList.add('hidden');
      });
      document.getElementById('image-lightbox')?.addEventListener('click', (e) => {
        if (e.target.id === 'image-lightbox') {
          document.getElementById('image-lightbox').classList.add('hidden');
        }
      });

      // Подробнее о безопасном режиме
      document.getElementById('safe-mode-info-btn')?.addEventListener('click', () => {
        openAuthModal('login');
        showAuthAlert('Безопасный режим активен: авторизация и история запросов работают локально в памяти браузера.');
      });
    }

    /* =========================================================================
       СТАРТ ПРИЛОЖЕНИЯ
       ========================================================================= */
    function bootstrap() {
      initLogoAsset();
      bindEvents();
      initAuth();

      // Предзагрузка скрипта Google CSE, если он выбран провайдером по умолчанию
      if (SEARCH.provider === 'google-cse') {
        ensureGoogleCseLoaded();
      }

      // Первичный роутинг по URL (?q=...&tab=...)
      const { q, tab } = getUrlParams();
      if (q) {
        renderResults(q, tab);
      } else {
        renderHome();
      }
    }

    bootstrap();
  </script>
</body>
</html>
