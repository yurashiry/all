<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Wero Ru™</title>


<meta name="theme-color" content="#000000">

<link rel="manifest" href="manifest.json">


<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/settings.css">


</head>


<body>


<!-- ===================== -->
<!-- APP -->
<!-- ===================== -->


<div id="app">



<!-- ===================== -->
<!-- HEADER -->
<!-- ===================== -->


<header class="header">


<div class="user-box">


<img
id="avatar"
class="avatar"
src="icons/default-avatar.png">



<div class="user-data">


<div
id="name"
class="name">

Имя

</div>



<div
id="username"
class="username">

@username

</div>


</div>


</div>



<button
id="settingsButton"
class="header-button">

⚙

</button>


</header>





<!-- ===================== -->
<!-- HOME -->
<!-- ===================== -->


<section
id="home"
class="screen active">



<div class="balance-card">


<div class="balance-label">

Баланс

</div>


<div
id="balance"
class="balance">

0 W

</div>


</div>




<div class="operations-block">


<h2>

Операции

</h2>



<div
id="operations">

</div>



</div>



</section>

<!-- ===================== -->
<!-- CARDS SCREEN -->
<!-- ===================== -->


<section
id="cards"
class="screen">


<div class="page-title">

Карты

</div>



<div
id="cardsContainer"
class="cards-container">



</div>



<button
id="createCardButton"
class="main-button">

Выпустить карту

</button>



</section>





<!-- ===================== -->
<!-- SETTINGS SCREEN -->
<!-- ===================== -->


<section
id="settings"
class="screen">



<div class="page-title">

Настройки

</div>




<div class="settings-profile">



<img
id="settingsAvatar"
class="settings-avatar"
src="icons/default-avatar.png">



<button
id="changeAvatar">

Изменить фото

</button>



</div>






<div class="settings-form">



<label>

Имя

</label>


<input
id="editFirstName"
type="text">





<label>

Фамилия

</label>


<input
id="editLastName"
type="text">





<label>

Номер телефона

</label>


<input
id="editPhone"
type="tel">





<label>

Username

</label>


<input
id="editUsername"
type="text">



</div>







<!-- USER ID -->


<div class="user-id-box">



<div>

Ваш Wero ID

</div>



<div
id="userId">

00000000

</div>



<button
id="copyId">

Скопировать

</button>



</div>







<div class="settings-actions">



<button
id="saveProfile"
class="main-button">

Сохранить

</button>




<button
id="logout">

Выйти

</button>




<button
id="deleteAccount"
class="danger-button">

Удалить аккаунт

</button>



</div>





</section>

<!-- ===================== -->
<!-- FLOATING IOS 26 BAR -->
<!-- ===================== -->


<nav
id="floatingBar"
class="floating-bar">



<div
class="bar-item active"
data-screen="home">


<div class="bar-icon">

⌂

</div>


<span>

Главная

</span>


</div>





<div
class="bar-item"
data-screen="cards">


<div class="bar-icon">

▣

</div>


<span>

Карты

</span>


</div>





<div
class="bar-item"
data-screen="settings">


<div class="bar-icon">

⚙

</div>


<span>

Настройки

</span>


</div>





<div
id="movingOval"
class="moving-oval">

</div>



</nav>







<!-- ===================== -->
<!-- CARD RELEASE MODAL -->
<!-- ===================== -->


<div
id="cardModal"
class="modal hidden">



<div
class="modal-window">



<h2>

Выпуск карты

</h2>



<p>

Стоимость выпуска:

<b>
250 W
</b>

</p>



<p>

Выпускаем?

</p>




<div class="modal-buttons">



<button
id="cardNo">

Нет

</button>




<button
id="cardYes"
class="main-button">

Да

</button>



</div>



</div>


</div>







<!-- ===================== -->
<!-- CARD TIMER MODAL -->
<!-- ===================== -->


<div
id="cardTimerModal"
class="modal hidden">



<div
class="modal-window">



<h2>

Карта выпускается

</h2>



<div
id="cardTimer">

3

</div>



<p>

Пожалуйста, подождите

</p>



</div>


</div>







<!-- ===================== -->
<!-- MESSAGE WINDOW -->
<!-- ===================== -->


<div
id="message"
class="message hidden">


</div>
<!-- ===================== -->
<!-- LOADING OVERLAY -->
<!-- ===================== -->

<div
id="loadingOverlay"
class="loading-overlay hidden">

    <div class="loading-box">

        <div class="loading-spinner"></div>

        <div class="loading-text">

            Загрузка Wero Ru...

        </div>

    </div>

</div>





<!-- ===================== -->
<!-- TOAST -->
<!-- ===================== -->

<div
id="toast"
class="toast hidden">

    <span id="toastText">

    </span>

</div>





<!-- ===================== -->
<!-- APP SCRIPTS -->
<!-- ===================== -->

<script src="js/storage.js"></script>

<script src="js/auth.js"></script>

<script src="js/wallet.js"></script>

<script src="js/home.js"></script>

<script src="js/cards.js"></script>

<script src="js/settings.js"></script>

<script src="js/ui.js"></script>

<script src="js/app.js"></script>





<script>

window.addEventListener("load",()=>{

    if(typeof App==="undefined"){

        console.error("App.js не найден");

        return;

    }

    App.init();

});





if("serviceWorker" in navigator){

    navigator.serviceWorker.register("./sw.js")

    .then(()=>{

        console.log("SW registered");

    })

    .catch(err=>{

        console.error(err);

    });

}






window.addEventListener(
"beforeinstallprompt",
e=>{

    e.preventDefault();

    window.weroInstallPrompt=e;

});

</script>

</body>

</html>
